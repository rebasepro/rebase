<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Rebase preview card</title>
<!--
  The one template behind every preview image the site serves: the per-route
  cards, the per-post cards and the GitHub social preview. It is a still of a
  drafted hero (HeroBackdrop.astro + the hero markup in HomeContent.astro):

    - the glow (NeatBackground's GLOW_CONFIG) lighting the top, masked into
      the #08090A ground from 30% to 78% of the height, as `.hero-glow`;
    - the drafting grid over it, 1px white at 0.045 on a twelfth of the
      shell, anchored on the left rail and faded out downwards, as
      `.hero-drafting`; the two rails at the shell's edges, as `.drafted`;
    - the eyebrow, mono uppercase tracked with a small cyan dot, as
      `.hero-eyebrow`; the headline in Instrument Sans 600 at the display
      tier's -0.032em; the subtitle in the page copy grey.

  Nothing else. No ticks or corner markers, no curves, no panel behind the
  type: the hero has none of them.

  It cannot be opened as a file: the copy and the glow's seat are injected at
  the CARD marker below, and the Neat licence only validates over http on
  localhost. Render it with scripts/og/neat.mjs (see og/README.md).

  Every length is in rem and 1rem is 1/75 of the width (16px at 1200), so
  1200x630 and 1280x640 are one composition at two scales. At 1200 the card
  is the site's 1440 desktop shell scaled to fit: a 960px shell between rails
  at 120px, cut into 80px cells.
-->
<style>
  @font-face { font-family: "Instrument Sans Variable"; src: url("/font-head.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Inter Variable"; src: url("/font-body.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("/font-mono.woff2") format("woff2"); font-weight: 400 700; }

  :root {
    --ground: #08090A;
    --rail: rgb(255 255 255 / 0.07);
    --grid: rgb(255 255 255 / 0.045);
    --rail-x: 7.5rem;   /* the shell's edge: (75 - 60) / 2 */
    --cell: 5rem;       /* a twelfth of the 60rem shell */
    --inset: 9.5rem;    /* the content box: rail + the shell's 2rem padding */
  }
  html { font-size: calc(100vw / 75); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--ground); }
  body {
    position: relative;
    color: #fff;
    font-family: "Inter Variable", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* .hero-glow */
  .glow {
    position: absolute; inset: 0;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 30%, transparent 78%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 30%, transparent 78%);
  }
  .glow canvas { display: block; width: 100vw; height: 100vh; }

  /* .hero-drafting: rows from the top, columns from the left rail, so the
     rails are the grid's first and thirteenth lines. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
    background-position: var(--rail-x) 0;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 95%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 95%);
  }

  /* .drafted::before: full height, the right border landing ON the
     thirteenth grid line rather than a pixel inside it. */
  .rails {
    position: absolute; top: 0; bottom: 0;
    left: var(--rail-x);
    right: calc(var(--rail-x) - 1px);
    border-inline: 1px solid var(--rail);
  }

  /* The nav row: the mark and wordmark on the content edge, the address on
     the other. */
  .top {
    position: absolute; top: 2.125rem; left: var(--inset); right: var(--inset);
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 0.875rem; }
  .brand img { width: 2.5rem; height: 2.5rem; display: block; }
  .brand span {
    font-family: "Instrument Sans Variable", system-ui, sans-serif;
    font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em;
  }
  .host {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.9375rem; text-transform: uppercase; letter-spacing: 0.22em;
    color: rgb(255 255 255 / 0.72);
  }

  .copy { position: absolute; left: var(--inset); right: var(--inset); bottom: 3.75rem; }

  /* .hero-eyebrow */
  .eyebrow {
    display: flex; align-items: center; gap: 0.75rem;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 1.0625rem; text-transform: uppercase; letter-spacing: 0.22em;
    color: rgb(255 255 255 / 0.78);
  }
  .eyebrow::before {
    content: ""; flex: none;
    width: 0.4375rem; height: 0.4375rem; border-radius: 9999px;
    background: #53EAFD; /* --color-cyan-300 */
  }

  /* The display tier: 600 at -0.032em, one colour, the shadow `.hero-home h1`
     sets over the glow. */
  h1 {
    margin-top: 1.375rem;
    font-family: "Instrument Sans Variable", system-ui, sans-serif;
    font-weight: 600; font-size: 4.375rem; line-height: 1; letter-spacing: -0.032em;
    max-width: 56rem; text-wrap: balance;
    text-shadow: 0 2px 30px rgb(0 0 0 / 0.45);
  }

  h1 .line { display: block; }

  /* .hero-sub */
  .sub {
    margin-top: 1.5rem; max-width: 46rem;
    font-size: 1.5rem; line-height: 1.45; color: #AEB3BA;
    text-wrap: pretty;
  }
  .sub strong { font-weight: 500; color: #fff; }

  /* The hero's command box. */
  .cmd {
    display: inline-flex; align-items: center; gap: 0.75rem;
    margin-top: 1.75rem; padding: 0.8125rem 1.25rem;
    border: 1px solid rgb(255 255 255 / 0.12); border-radius: 0.625rem;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 1.0625rem; color: #D7DADE; white-space: nowrap;
  }
  .cmd b { font-weight: 400; color: #82878D; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="glow"><canvas id="c"></canvas></div>
  <div class="grid"></div>
  <div class="rails"></div>

  <div class="top">
    <div class="brand"><img src="/logo.svg" alt="" /><span>Rebase</span></div>
    <span class="host">rebase.pro</span>
  </div>

  <div class="copy">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="sub" id="sub" hidden></p>
    <div class="cmd" id="cmd" hidden><b>$</b><span></span></div>
  </div>

<script type="application/json" id="card">/*CARD*/</script>
<script type="module">
  import { NeatGradient } from "/neat.js";
  const card = JSON.parse(document.querySelector("#card").textContent);
  const $ = (id) => document.getElementById(id);

  $("eyebrow").textContent = card.eyebrow;
  // A "\n" in a title is a line of its own, as the home hero's two
  // `.hero-line` spans are; each line still balances if it has to wrap.
  for (const line of card.title.split("\n")) {
    const span = document.createElement("span");
    span.className = "line";
    span.textContent = line;
    $("title").append(span);
  }
  if (card.subHtml || card.sub) {
    if (card.subHtml) $("sub").innerHTML = card.subHtml;
    else $("sub").textContent = card.sub;
    $("sub").hidden = false;
  }
  if (card.cmd) {
    $("cmd").querySelector("span").textContent = card.cmd;
    $("cmd").hidden = false;
  }

  // Fonts first, so neither the fit nor the screenshot is measured in the
  // fallback face.
  await document.fonts.ready;

  // A long headline steps down until the copy clears the nav row with the
  // same air it has above the type on the site, instead of running under it.
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const ceiling = document.querySelector(".top").getBoundingClientRect().bottom + 4.5 * rem;
  const h1 = $("title");
  let size = 4.375;
  while ($("eyebrow").getBoundingClientRect().top < ceiling && size > 2.75) {
    size -= 0.125;
    h1.style.fontSize = `${size}rem`;
  }

  new NeatGradient({ ref: document.querySelector("#c"), ...card.glow });
  // Two frames: the first sizes the drawing buffer, the second draws. Speed 0
  // holds the clock at the seat's seed, so the frame does not move after.
  requestAnimationFrame(() => requestAnimationFrame(() => { window.__ready = true; }));
</script>
</body>
</html>
