# Build and push the runtime image for a version that is already released.
#
# ## Why this exists separately from `publish.yml`
#
# A stable release does four one-way things in order: publish to npm, push a
# version-bump commit, push a tag, then build and push `rebasepro/server:<v>`.
# The Docker Hub login sits *between* the third and the fourth, so a bad
# credential leaves a release half-finished — npm and git carrying a version
# whose scaffolded `docker-compose.yml` pulls an image that does not exist.
#
# That is exactly what happened to 0.13.0, and again to 0.14.1 when the Docker
# Hub token expired: `Check release credentials` passed because the secret was
# present, and the login then failed because a present secret is not a valid one.
#
# Re-running `publish.yml` is not the repair. It would compute the *next* patch
# and publish a new version to npm to fix a missing image for the current one —
# so the only way to get an image for 0.14.1 would be to release 0.14.2.
#
# This job builds the image for a version that already exists, from the tag that
# already exists, and does nothing else. It publishes nothing to npm, bumps no
# version, and creates no tag.
name: Publish runtime image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to build the image for, e.g. 0.14.1"
        required: true
      ref:
        description: "Git ref to build from. Defaults to v<version>."
        required: false
      move_latest:
        description: "Also move the `latest` tag to this image"
        type: boolean
        default: true

jobs:
  image:
    runs-on: ubuntu-latest
    # Two successful runs to go on, both near 10 minutes — a thin sample for a
    # job whose cost is dominated by a linux/amd64,linux/arm64 build. The arm64
    # half runs under emulation, so a cold layer cache is legitimately several
    # times a warm one, and this is the job most likely to be slow for real
    # rather than hung. Sized against that, not against the two runs: it is here
    # to end a six-hour hang, not to police a slow build.
    timeout-minutes: 60
    concurrency:
      group: runtime-image-${{ inputs.version }}
      cancel-in-progress: false

    # Exchanged for an Artifact Registry token. `publish.yml` already asks for it
    # to get npm provenance; here it is the only reason the permission exists.
    permissions:
      contents: read
      id-token: write

    env:
      FLEET_REGISTRY: europe-west1-docker.pkg.dev
      FLEET_IMAGE: europe-west1-docker.pkg.dev/rebase-578f2/rebase-saas-images/rebasepro/server

    steps:
      - name: Resolve the ref
        id: ref
        run: echo "ref=${{ inputs.ref || format('v{0}', inputs.version) }}" >> "$GITHUB_OUTPUT"

      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      # The image must be built from what was released, not from whatever main
      # has become since. A tag that does not exist is a typo in the input, and
      # failing here costs nothing; failing after a push does not.
      - name: The ref must carry the version being built
        run: |
          PKG=$(node -p "require('./packages/server/package.json').version")
          if [ "$PKG" != "${{ inputs.version }}" ]; then
            echo "::error::${{ steps.ref.outputs.ref }} carries @rebasepro/server $PKG, not ${{ inputs.version }}."
            echo "The image would be tagged with a version its own contents do not claim."
            exit 1
          fi
          echo "$PKG at ${{ steps.ref.outputs.ref }} — matches."

      # The fleet tag names the released commit, exactly as `publish.yml` does,
      # so a repaired release and a clean one are indistinguishable afterwards.
      - name: Name the fleet tag
        id: fleet
        run: echo "tag=${{ inputs.version }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Before the build, not after: a build is several minutes of work that a
      # bad credential throws away, and this is the failure being repaired.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same reasoning, and the more important half here: the versions this
      # workflow exists to repair (0.14.0, 0.14.1, 0.15.0) are missing from the
      # private registry too, and a repair that fixed only the public tag would
      # leave the fleet exactly where it was.
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.FLEET_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Build and push the runtime image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/server.Dockerfile
          # Both architectures, as the release does: a self-hoster on Apple
          # silicon otherwise gets qemu emulation, which is slow enough on first
          # boot to read as a hang.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            rebasepro/server:${{ inputs.version }}
            ${{ inputs.move_latest && format('rebasepro/server:latest') || '' }}
            ${{ env.FLEET_IMAGE }}:${{ steps.fleet.outputs.tag }}

      # Publishing is not the same as being pullable. Ask the registry from
      # outside, with no credentials, the way a self-hoster's daemon will.
      - name: Verify the image is pullable
        run: node tooling/scripts/check-runtime-image.mjs --live --version "${{ inputs.version }}"

      - name: Summary
        run: |
          {
            echo "### Runtime image published"
            echo ""
            echo "- \`rebasepro/server:${{ inputs.version }}\`"
            [ "${{ inputs.move_latest }}" = "true" ] && echo "- \`rebasepro/server:latest\` moved to it"
            echo "- \`${{ env.FLEET_IMAGE }}:${{ steps.fleet.outputs.tag }}\`"
            echo "- digest \`${{ steps.image.outputs.digest }}\`"
            echo "- built from \`${{ steps.ref.outputs.ref }}\`"
            echo ""
            echo "Nothing was published to npm and no version was bumped."
            echo ""
            echo "The fleet still runs whatever it ran before. To register this image as a"
            echo "runtime release and roll it, from \`saas/backend\`:"
            echo ""
            echo "\`\`\`bash"
            echo "pnpm release:runtime --image-tag=${{ steps.fleet.outputs.tag }} --roll --apply"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
