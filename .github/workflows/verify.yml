name: Verify

# The full gate — type checks, the headless/BaaS guards, the build, unit tests and
# every end-to-end suite — defined once and called from three places:
#
#   ci.yml            on every push to main and every PR
#   publish.yml       before a STABLE release, which must not ship unless all of
#                     this passed for the exact commit being released
#   publish.yml       and before a CANARY, for the same reason
#
# Canary used to skip it, on the reasoning that a canary publishes if it compiles.
# That made the canary channel one nobody had checked — 0.13.1-canary.gcd6689e
# published with `check:hooks` red — so it gates now too. Both publish channels
# are manual, so this no longer runs twice for a merge to main: ci.yml gates the
# push, and a canary run gates the commit somebody chose to publish.
#
# It exists as a reusable workflow rather than copied steps because the copy is the
# failure mode: the release path is the one that runs rarely, so it is the one that
# would quietly drift out of date and stop testing what CI tests.

on:
  workflow_call:

permissions:
  contents: read

# ── Why this is seven jobs and not two ────────────────────────────────────────
#
# It was `checks` then `e2e`, in series, because `e2e` declared `needs: checks`:
# 16 minutes plus 18, so every merge and every release waited ~34 minutes on a
# gate whose two halves never exchanged a byte. `e2e` checks out, installs and
# builds on its own runner — the dependency was ordering, not data, and what the
# ordering bought was "don't spend e2e minutes when the types are already red".
# At half an hour a release that is the wrong trade.
#
# So the gate fans out. Every job below is a leaf: none declares `needs`, all
# start at once, and the wall clock is the slowest one instead of the sum. The
# split lines are the real couplings, not tidy categories:
#
#   static         everything that reads SOURCE — no build, no database.
#   build-gates    `pnpm run build` and the gates that read what it emitted.
#   unit           the unit suites, which run serialized by design.
#   e2e-cli        scaffolds and boots projects; owns the screenshot artifact.
#   e2e-admin      the browser suite; the only job needing Playwright's deps.
#   e2e-selfhost   self-host and bundle acceptance, plus the RLS scan that reads
#                  the database the acceptance step creates — see its comment.
#   e2e-vitest     the security and integration suites, and the long pole.
#
# Every job re-installs and most rebuild. That is deliberate: the install is
# ~15s against pnpm's cache and the build ~70s, whereas handing `dist/` between
# jobs as an artifact would reintroduce the barrier this exists to remove. It
# costs roughly a quarter more runner-minutes and returns two thirds of the wall
# clock.
#
# The timeouts are each set for the reason the old two were: GitHub's default is
# six hours, so a step that hangs rather than fails holds its runner — and the
# merge behind it — all afternoon while reporting "pending". Each is roughly 2x
# the slowest observed run of that job, which passes a genuine slowdown and
# still catches a hang.
#
# A job added here needs no change in publish.yml: it depends on the whole
# workflow call (`needs: verify-stable`), so a release gates on all of them.
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  # Every gate that reads source and needs nothing built, no database and no
  # browser. Docker appears only for the runtime image, which boots from a
  # published tag rather than from anything this job produced.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Helm, because one gate in the list renders the chart. CI installs it
      # rather than skipping that gate: `ci:static` refuses to skip a gate when
      # `CI` is set, precisely so the pipeline cannot quietly run a smaller set
      # than it reports.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          # The version the docs claim the chart is rendered against, and the one
          # `check:chart` runs locally. A guide that names a version CI does not
          # use is a guide making a promise nobody checks.
          version: v4.2.4

      # Every gate that reads source, as one command. The list and the reason
      # each gate exists live in tooling/scripts/ci-static.mjs, and are rendered
      # as a table in docs/gates.md — so a contributor runs exactly what CI runs
      # instead of a smaller set a shell script happened to name. Twenty-five
      # copied YAML steps were a list only CI knew.
      - name: Static gates
        run: pnpm run ci:static

  # The build, and only the gates that read what it emitted — published .d.ts,
  # the template and ejected-project typechecks, the API surface, the eager-JS
  # budget. Split from `static` because these cannot start before the build
  # finishes and those never need it at all.
  build-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # Moved after the build, for the same reason the API-surface check is:
      # these compile a *scaffolded project*, which resolves `@rebasepro/*`
      # through node_modules and its `exports` map. `@rebasepro/server/functions`
      # points at `dist/functions/index.d.ts`, so before the build it resolves to
      # nothing and the baas preset fails TS2307 — which is what every pull
      # request started doing the moment the portable functions entry point
      # landed. A developer's checkout has a stale `dist` lying around and so
      # never saw it; CI has none.

      # The scaffolded collection files, compiled once per preset as `rebase init`
      # lays them out, plus a probe that adds what a user adds first: a custom
      # component with an image inside it, attached by a lazy import thunk. Nothing
      # else checks them fast: the only thing that compiled them was the CMS init
      # e2e, inside a Docker build ~15 minutes in, so a template carrying a stale
      # collection shape stayed invisible until the very last gate.
      - name: Init template typecheck
        run: pnpm run check:templates

      # `rebase eject` is the one command that hands a user server code to run,
      # and it was in NO job here and no end-to-end test: `packages/cli/templates/`
      # sits outside the CLI's tsconfig `rootDir`, so the entrypoint, Dockerfile
      # and compose file it writes had never been compiled, built or booted by
      # anything in this repository. Four HIGH defects shipped in that gap and
      # were found by reading — a headless entrypoint importing files
      # `--headless` deletes, a `serveSPA` path wrong by two directory levels, a
      # Dockerfile copying neither `frontend` nor `rebase.json`, and crons never
      # compiled nor passed.
      #
      # This materializes a scaffolded project, runs the real command into it and
      # compiles what it emits, once per flavour, then checks the Dockerfile
      # against the project on disk. It does NOT build the image or boot it —
      # that needs an install against a lockfile no scaffold has yet, and belongs
      # in the e2e lane. Seconds, no network, no database.
      # `rebase.resources.json` is generated from `config/resources.ts` and
      # committed, because a host reads it to decide what to provision before it
      # runs anything. `rebase build` rewrites it — but a `runtime: "custom"`
      # project never runs `rebase build`, it builds its own image. So for
      # exactly the projects where that file is the ONLY record of what they
      # need, nothing kept it fresh: `rebase resources --check` existed and
      # nothing ran it, here or anywhere.
      - name: Resource graphs match their declarations
        run: pnpm run check:resource-graphs

      - name: Ejected project typecheck
        run: pnpm run check:eject
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # `@rebasepro/server` is the one package `infra/docker/entrypoint.mjs` symlinks
      # over a deployed bundle's own copy, so its exports move underneath tenant
      # code that is already built — during a fleet rollout nobody asked for. A
      # removed export is therefore not a compile error for anyone; it is a boot
      # failure, in a wave. 0.13.0 removed two exports from it with nothing here
      # to notice. Reads dist/index.d.ts, hence after the build.
      - name: Runtime API surface
        run: pnpm run check:api-surface

      # Documentation is the one consumer of the API that is never compiled. A
      # skill can instruct people to import a deleted symbol indefinitely and
      # nothing notices — the code is a fenced block. Two were live when this was
      # added: a cron skill declaring the removed `ctx.client` in a type block
      # eight lines under its own prose saying the name was gone, and a backend
      # skill whose FIX for a confusing dual-package error was itself an import
      # that did not resolve. Reads the same baseline as the gate above.
      - name: Documented imports exist
        run: pnpm run check:docs-imports

      # The pre-1.0 RLS constants look like dead compatibility and are not: on
      # 2026-08-27 five of six managed tenants wrote every or nearly every policy
      # in the `auth.uid()` form — dadaki 64 of 64. Whoever eventually deletes
      # them will grep for usages, find two readers, and conclude from the code
      # that nothing depends on them. The dependency is in five databases, and
      # this is where that gets said. Exit condition is in the script.
      - name: Pre-1.0 RLS compatibility is intact
        run: pnpm run check:legacy-rls

      # Whether the *published* types survive being resolved. Every other gate
      # in this file maps `@rebasepro/*` onto source, so all of them were blind
      # to the state the packages were actually shipped in: extensionless
      # relative specifiers in the emitted .d.ts, which `moduleResolution:
      # "nodenext"` rejects — and TypeScript answers by typing the whole import
      # `any` rather than by erroring. Nobody reported it in the entire life of
      # the packages, because the only symptom appears in the consumer's own
      # file and reads as their tsconfig being wrong. Reads dist, hence after
      # the build.
      - name: Published types resolve
        run: pnpm run check:dts

      # What a browser downloads before the login screen paints. Nothing
      # measured it, and three separate libraries had drifted into that set:
      # exceljs (940 kB) behind a `lazy()` that a barrel re-export cancelled,
      # lucide's entire icon map (822 kB) re-exported by name so tree-shaking
      # could not touch it, and every date-fns locale (641 kB) reached through
      # `import * as locales`. None of that fails a type check or a test.
      #
      # Budgets the EAGER set — the entry chunk plus what index.html preloads —
      # not the dist, which is dominated by legitimately lazy routes and would
      # therefore punish the fix. Reads `app/frontend/dist`, hence after the
      # build.
      - name: Eager JavaScript budget
        run: pnpm run check:bundle

      # The API-surface gate's own tests, over a fixture barrel. It spent its
      # whole life unable to see a member disappear from `const rebase` — a bare
      # entry has no members to lose — so the gate that guards the fleet needs a
      # gate of its own. Fixtures only: no build, no database.
      - name: Contract gate self-tests
        run: pnpm run test:gates

      # The examples were in no pipeline and in no root script — `pnpm build`
      # covers `./packages/*` and `./app` only — so examples/firebase stopped
      # compiling at the BaaS/admin split and nothing said so for weeks. They
      # resolve @rebasepro/* to built output like a real user does, not to source
      # like `pnpm typecheck`, which is exactly why they catch a different class
      # of drift; hence after the build.
      - name: Examples typecheck
        run: pnpm run check:examples
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # llms.txt and sitemap.md are generated by the website's `prebuild` and
      # committed, so they only refresh when someone happens to build the site —
      # llms.txt sat a commit behind the docs it summarises. Regenerate and fail
      # on a diff, which is the whole check: if this step changes a tracked file,
      # the commit that changed the docs forgot to.
      - name: Generated website artifacts are current
        run: pnpm run check:generated

  # The unit suites. `pnpm -r test` runs with --workspace-concurrency=1, so this
  # is ~3.5 minutes of strictly serial work; on its own runner it costs nothing,
  # at the tail of a job it held everything else up.
  #
  # It builds first because that is the order these suites have always run in
  # here. A suite that turns out to read built output would otherwise fail on a
  # source-only runner in a way that reads as a real regression.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Run tests
        run: pnpm test
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # The agent harness's own tests. They need neither a database nor a build,
      # and nothing else covers `tooling/scripts/harness/` — including the deploy
      # preflight that AGENT.md describes as an enforced gate.
      - name: Harness tests
        run: pnpm run test:harness

  # Scaffolding a project and driving it: `init`, the BaaS template, and the
  # client SDK over a real socket. Playwright is installed because cli-init-e2e
  # captures its screenshots through it — this job uploads them.
  e2e-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The vitest e2e suites drive @rebasepro/server's built dist, and the CLI
      # suite scaffolds a project that consumes every package as built output
      # (its `assertPackagesBuilt` guard fails otherwise). This job runs on its
      # own runner, so the `checks` job's build does not reach it — build here. Only
      # `./packages/*`, not the admin app, which the e2e never boots.
      - name: Build packages
        run: pnpm --filter './packages/*' -r run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Start PostgreSQL container
        run: |
          docker run --name rebase-postgres -e POSTGRES_DB=rebase_saas -e POSTGRES_USER=rebase -e POSTGRES_PASSWORD=rebase -p 5432:5432 -d postgres:18
          until docker exec rebase-postgres pg_isready -U rebase -d rebase_saas; do
            echo "Waiting for postgres..."
            sleep 1
          done

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E Test Suite
        run: pnpm exec tsx tests/e2e/tests/cli-init-e2e.ts
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          SCREENSHOT_DIR: ${{ github.workspace }}/.artifacts/e2e-screenshots

      # The only place a scaffolded project is installed and booted for real —
      # workspace: deps don't resolve anywhere else — so it's what proves the
      # baas template rather than just the library behind it.
      #
      # `always()` because the two suites cover different things, and a failure in
      # the first said nothing about this one: it was skipped, so a single broken
      # run reported half the truth and each fix revealed the next failure. This
      # does not soften anything — the step still fails the job on its own, and
      # the earlier step's failure still fails it. It only stops the second
      # report from being suppressed by the first.
      - name: Run BaaS E2E
        if: always()
        run: pnpm exec tsx tests/e2e/tests/cli-init-baas-e2e.ts
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # `@rebasepro/client`, driven the way a browser application drives it.
      #
      # Every tier of this path was covered and the composition of them was not:
      # the client's own tests use a mocked transport, `rls-enforcement` proves
      # RLS at the database tier with no HTTP or tokens, and `Run BaaS E2E`
      # above drives the real SDK over the network but authenticates with a
      # SERVICE KEY — the server-to-server path, which bypasses user identity
      # and therefore never exercises RLS at all.
      #
      # So: register, sign in, have the server derive auth.uid() from the token,
      # have Postgres scope rows to it, refresh, upload a file, receive a
      # realtime event, sign out. Each tier can be individually correct and
      # still disagree at the seam, and the seam is what this covers.
      #
      # It brings its own Postgres container (random host port, no clash with
      # the service above) and boots the reference backend on a real socket —
      # not `app.fetch()`, because a token that never crosses a socket proves
      # nothing about headers and realtime is a WebSocket upgrade an in-process
      # fetch cannot perform.
      #
      # ~10s once the packages are built. It already earned its place: it found
      # that `client.close()` left the scheduled token-refresh timer armed, so
      # any signed-in Node script hung forever after closing.
      #
      # `always()` for the same reason as its neighbours.
      - name: Client SDK E2E (end-user auth, RLS, storage, realtime)
        if: always()
        run: pnpm exec tsx tests/e2e/tests/client-sdk-e2e.ts
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # The Playwright admin suite used to be excluded here, on the grounds that
      # its `global-setup` needs a demo user that already exists and seeded
      # collections to render — "a provisioned database, not a workflow step".
      # That was true and is now handled: see `Admin panel E2E (Playwright)`
      # above, which provisions and seeds one, and a `global-setup` that drives
      # the first-run bootstrap when the user does not exist yet.
      - name: Upload E2E Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ github.workspace }}/.artifacts/e2e-screenshots/
          if-no-files-found: ignore

  # The admin panel in a browser, against a database provisioned and seeded here.
  e2e-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The vitest e2e suites drive @rebasepro/server's built dist, and the CLI
      # suite scaffolds a project that consumes every package as built output
      # (its `assertPackagesBuilt` guard fails otherwise). This job runs on its
      # own runner, so the `checks` job's build does not reach it — build here. Only
      # `./packages/*`, not the admin app, which the e2e never boots.
      - name: Build packages
        run: pnpm --filter './packages/*' -r run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Start PostgreSQL container
        run: |
          docker run --name rebase-postgres -e POSTGRES_DB=rebase_saas -e POSTGRES_USER=rebase -e POSTGRES_PASSWORD=rebase -p 5432:5432 -d postgres:18
          until docker exec rebase-postgres pg_isready -U rebase -d rebase_saas; do
            echo "Waiting for postgres..."
            sleep 1
          done

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      # The admin panel itself, driven in a browser. `cli-init-e2e` proves a
      # scaffolded project installs and answers HTTP; nothing until now opened
      # the UI that project exists to provide, so every collection view, the
      # collection editor and the SQL console could break and stay green.
      #
      # This suite was written to be deterministic (pinned API port, adopt-or-
      # start detection, teardown that reaps only servers it owns) and then ran
      # in no pipeline — AUDIT-2026-07-28 finding A left it open because nobody
      # had watched an unattended run. It has now been run repeatedly, in CI mode
      # with a cold server boot, against both a fresh database and a populated
      # one: 10 tests, ~33s, green each time.
      #
      # The reason it could not simply be switched on is the database. CI's is
      # always empty, so `/auth/config` reports `needsSetup` and LoginView shows
      # its bootstrap form instead of the sign-in screen — globalSetup waited for
      # a "Sign in with email" button that first-run never renders and failed all
      # ten tests at once. It now drives whichever screen is up, which means this
      # step also covers creating the first admin: the first thing every new user
      # of Rebase does, and previously tested at no tier.
      #
      # Schema then seed, both against a database created here: `db push` is what
      # a developer runs, so a break in it fails here rather than in somebody's
      # first ten minutes.
      #
      # `always()` for the same reason as its neighbours: different ground, and
      # it still fails the job on its own.
      - name: Admin panel E2E (Playwright)
        if: always()
        run: |
          docker exec rebase-postgres createdb -U rebase rebase_admin_e2e
          (cd app && pnpm exec rebase db push --yes)
          (cd app/backend && pnpm exec tsx src/seed.ts)
          pnpm exec playwright test -c tests/e2e/playwright.config.ts
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          # sslmode=disable: the CI Postgres container serves no TLS, and Atlas
          # (which `db push` shells out to) negotiates SSL first and fails with
          # "SSL is not enabled on the server" rather than falling back.
          DATABASE_URL: postgres://rebase:rebase@localhost:5432/rebase_admin_e2e?sslmode=disable
          JWT_SECRET: ci-admin-e2e-secret-ci-admin-e2e-secret-0123456789

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .artifacts/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Self-host acceptance, the container that ships it, the frozen bundle corpus —
  # and the RLS scan, which has to stay here: it scans `rebase_acceptance`, the
  # database `Self-host acceptance` creates and pushes real DDL into. Split apart,
  # the scan would meet an empty database, and its --min-tables/--min-policies
  # floors would fail every run. That coupling is the only ordering constraint
  # left in this file.
  e2e-selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The vitest e2e suites drive @rebasepro/server's built dist, and the CLI
      # suite scaffolds a project that consumes every package as built output
      # (its `assertPackagesBuilt` guard fails otherwise). This job runs on its
      # own runner, so the `checks` job's build does not reach it — build here. Only
      # `./packages/*`, not the admin app, which the e2e never boots.
      - name: Build packages
        run: pnpm --filter './packages/*' -r run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Start PostgreSQL container
        run: |
          docker run --name rebase-postgres -e POSTGRES_DB=rebase_saas -e POSTGRES_USER=rebase -e POSTGRES_PASSWORD=rebase -p 5432:5432 -d postgres:18
          until docker exec rebase-postgres pg_isready -U rebase -d rebase_saas; do
            echo "Waiting for postgres..."
            sleep 1
          done

      # The self-host acceptance run: build a real bundle from the reference
      # app's collections, fold two static apps in at different paths, boot it
      # against a real database and fetch it as a browser would.
      #
      # `tooling/scripts/verify-selfhost.mts` says to run it when you touch the manifest,
      # the bundle format, folding or serveSPA — and until now nothing did, so
      # the entire multi-app serving path had no automated proof at any tier.
      # It reuses the Postgres service above; the script pushes the schema
      # itself, but the database has to exist first.
      #
      # `always()` for the same reason as its neighbours: it covers different
      # ground, and still fails the job on its own.
      - name: Self-host acceptance
        if: always()
        run: |
          docker exec rebase-postgres createdb -U rebase rebase_acceptance
          pnpm run verify:selfhost
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          ACCEPTANCE_DATABASE_URL: postgres://rebase:rebase@localhost:5432/rebase_acceptance

      # The same recipe, but through the artifact a stranger actually runs.
      #
      # The step above imports the runtime by path — deliberately, so a worktree
      # cannot verify the wrong checkout — which means it proves the code and not
      # the container. Its own header concedes the gap: "what that adds over this
      # script is a container and an image tag." So nothing had ever executed
      # `infra/docker/docker-compose.selfhost.yml`, and nothing had ever booted the
      # published image. `check-runtime-image` asserts that image has a
      # publisher; this asserts it runs.
      #
      # It builds the image from this commit, brings the compose file up on
      # non-default ports, and fetches from OUTSIDE the container: the SPA, a
      # 401 on an unauthenticated collection read, the collections served to a
      # service key (which is how boot-time provisioning proves it happened),
      # and a seeded admin who can actually sign in. Then it restarts the api,
      # because provisioning runs on every boot and the second one is where a
      # non-idempotent step surfaces — otherwise as a crash loop on somebody's
      # server days after they deployed.
      #
      # It then does the whole thing again with the compose file `rebase init`
      # generates, whose environment contract is a different one answered by a
      # different writer (`configureEnvFile`, called here rather than
      # transcribed). Both halves have shipped broken independently, and from a
      # terminal each looks like the other's fault.
      #
      # `always()` for the same reason as its neighbours.
      - name: Self-host container acceptance
        if: always()
        run: pnpm run verify:selfhost:docker
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # Every bundle shape we have ever shipped, booted on the runtime as it is
      # now. The managed tier moves projects onto new images automatically,
      # without anyone rebuilding them, and the only thing that had been standing
      # behind that promise was a health gate watching request and error rates —
      # which sees a crash loop and cannot see a bundle that stopped loading its
      # collections, a schema version that changed identity under a deployed
      # project, or an old manifest shape that now parses to something subtly
      # different. Those are the regressions a fleet-wide auto-upgrade turns into
      # one simultaneous outage.
      #
      # The fixtures are frozen and hand-authored, NOT built here: a fixture the
      # builder regenerates moves whenever the builder moves, which is the one
      # thing a regression corpus must not do. When one fails, the finding is
      # that a bundle already deployed would fail — see tests/fixtures/bundles/README.md.
      #
      # Two axes, not one. Besides the frozen bundle SHAPES, this now boots the
      # representative fixture once per published `@rebasepro/server-postgres`,
      # with today's `@rebasepro/server` symlinked over it exactly as
      # `infra/docker/entrypoint.mjs` does. That pairing — new server, old driver — is
      # what every managed project actually runs, because the image supplies the
      # server and the bundle supplies the driver; it has already caused one
      # production login outage, and nothing tested it until now. Needs the
      # network (npm) and CREATE DATABASE, both of which this job already has.
      #
      # `always()` for the same reason as its neighbours: different ground, and
      # it still fails the job on its own.
      - name: Bundle corpus
        if: always()
        run: |
          docker exec rebase-postgres createdb -U rebase rebase_corpus
          pnpm run verify:corpus
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          CORPUS_DATABASE_URL: postgres://rebase:rebase@localhost:5432/rebase_corpus

      # The gate the whole rls-check package existed for and never had: point it
      # at a database this pipeline actually generated. `Self-host acceptance`
      # above runs `rebase db push` over the reference app's collections, so
      # `rebase_acceptance` holds real generated DDL and a real policies.sql
      # applied to it — the same artefact a user gets, which is the only thing
      # worth gating on. A policy that grants more than the collection asked for
      # fails the build here.
      #
      # Findings the collections declare ON PURPOSE (the reference app is
      # public-read, so its SELECT policies are `USING (true)` and rls-check is
      # right to say so) live in tooling/scripts/rls-baseline.json, per table, with a
      # reason. That is deliberately not `--skip policy-always-true`: the same
      # check on a table nobody baselined — a newly added collection, say — still
      # fails.
      #
      # `--min-tables/--min-policies` are what stop this from being the vacuous
      # gate this repo has been burned by before: with `if: always()` the step
      # runs even when the push above failed, and against the empty database that
      # leaves, rls-check finds nothing and exits 0. The floors turn that into
      # exit 2. They are floors, not equality — a removed collection is not a
      # security event — set well below the ~11 tables / ~88 policies the
      # reference app currently generates.
      - name: RLS scan of the generated schema
        if: always()
        run: pnpm rls:check --min-tables 8 --min-policies 40
        env:
          RLS_CHECK_DATABASE_URL: postgres://rebase:rebase@localhost:5432/rebase_acceptance?sslmode=disable

  # The security and integration suites. Each test file boots and tears down its
  # own Postgres and the packages run one after another, which makes this the
  # longest single job in the gate — so nothing is scheduled behind it.
  e2e-vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The vitest e2e suites drive @rebasepro/server's built dist, and the CLI
      # suite scaffolds a project that consumes every package as built output
      # (its `assertPackagesBuilt` guard fails otherwise). This job runs on its
      # own runner, so the `checks` job's build does not reach it — build here. Only
      # `./packages/*`, not the admin app, which the e2e never boots.
      - name: Build packages
        run: pnpm --filter './packages/*' -r run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Start PostgreSQL container
        run: |
          docker run --name rebase-postgres -e POSTGRES_DB=rebase_saas -e POSTGRES_USER=rebase -e POSTGRES_PASSWORD=rebase -p 5432:5432 -d postgres:18
          until docker exec rebase-postgres pg_isready -U rebase -d rebase_saas; do
            echo "Waiting for postgres..."
            sleep 1
          done

      # The product's real security coverage, orphaned until now (this suite ran
      # in NO pipeline, so a change breaking RLS shipped green — AUDIT P0 #2).
      # rls-enforcement boots a real Postgres and asserts DB state after every
      # RLS denial; policy-agreement proves the Postgres and JS policy backends
      # agree; cdc/db/channel-history/cli round out the integration surface.
      # @rebasepro/rls-check joins them for the same reason it was added: its
      # fixture asserts that each of the fourteen checks fires on the object
      # built to trip it AND that nothing fires on the `secure_*` objects, which
      # is the only thing standing between the gate below and a scanner that has
      # quietly stopped detecting anything. RLS_CHECK_REQUIRE_DOCKER turns its
      # "no Docker, skip" escape hatch into a failure here — a skipped suite
      # reports success for a scan that never ran.
      #
      # Each test file boots and tears down its OWN Postgres via Docker (random
      # host ports — no clash with the 5432 service above), so there are no
      # connection settings to wire. `--workspace-concurrency=1` runs the two
      # packages' suites one after another, and each vitest config sets
      # `fileParallelism: false`, so exactly one container is ever live — the
      # arrangement that makes this reliable on a shared runner.
      #
      # `always()`: like the two steps above, this covers different ground, so a
      # failure there must not suppress this report. It still fails the job on
      # its own.
      - name: Run security & integration E2E (vitest)
        if: always()
        run: pnpm --filter @rebasepro/server-postgres --filter @rebasepro/cli --filter @rebasepro/rls-check --workspace-concurrency=1 test:e2e
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          RLS_CHECK_REQUIRE_DOCKER: "1"
