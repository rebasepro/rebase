name: Verify

# The full gate — type checks, the headless/BaaS guards, the build, unit tests and
# every end-to-end suite — defined once and called from three places:
#
#   ci.yml            on every push to main and every PR
#   publish.yml       before a STABLE release, which must not ship unless all of
#                     this passed for the exact commit being released
#   publish.yml       and before a CANARY, for the same reason
#
# Canary used to skip it, on the reasoning that a canary publishes if it compiles.
# That made the canary channel one nobody had checked — 0.13.1-canary.gcd6689e
# published with `check:hooks` red — so it gates now too. Both publish channels
# are manual, so this no longer runs twice for a merge to main: ci.yml gates the
# push, and a canary run gates the commit somebody chose to publish.
#
# It exists as a reusable workflow rather than copied steps because the copy is the
# failure mode: the release path is the one that runs rarely, so it is the one that
# would quietly drift out of date and stop testing what CI tests.

on:
  workflow_call:

permissions:
  contents: read

# ── Why this is seven jobs and not two ────────────────────────────────────────
#
# It was `checks` then `e2e`, in series, because `e2e` declared `needs: checks`:
# 16 minutes plus 18, so every merge and every release waited ~34 minutes on a
# gate whose two halves never exchanged a byte. `e2e` checks out, installs and
# builds on its own runner — the dependency was ordering, not data, and what the
# ordering bought was "don't spend e2e minutes when the types are already red".
# At half an hour a release that is the wrong trade.
#
# So the gate fans out. Every job below is a leaf: none declares `needs`, all
# start at once, and the wall clock is the slowest one instead of the sum. The
# split lines are the real couplings, not tidy categories:
#
#   static         everything that reads SOURCE — no build, no database.
#   build-gates    `pnpm run build` and the gates that read what it emitted.
#   unit           the unit suites, which run serialized by design.
#   e2e-cli        scaffolds and boots projects; owns the screenshot artifact.
#   e2e-admin      the browser suite; the only job needing Playwright's deps.
#   e2e-selfhost   self-host and bundle acceptance, plus the RLS scan that reads
#                  the database the acceptance step creates — see its comment.
#   e2e-vitest     the security and integration suites, and the long pole.
#
# Every job re-installs and most rebuild. That is deliberate: the install is
# ~15s against pnpm's cache and the build ~70s, whereas handing `dist/` between
# jobs as an artifact would reintroduce the barrier this exists to remove. It
# costs roughly a quarter more runner-minutes and returns two thirds of the wall
# clock.
#
# The timeouts are each set for the reason the old two were: GitHub's default is
# six hours, so a step that hangs rather than fails holds its runner — and the
# merge behind it — all afternoon while reporting "pending". Each is roughly 2x
# the slowest observed run of that job, which passes a genuine slowdown and
# still catches a hang.
#
# A job added here needs no change in publish.yml: it depends on the whole
# workflow call (`needs: verify-stable`), so a release gates on all of them.
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  # Every gate that reads source and needs nothing built, no database and no
  # browser. Docker appears only for the runtime image, which boots from a
  # published tag rather than from anything this job produced.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Helm, because one gate in the list renders the chart. CI installs it
      # rather than skipping that gate: `ci:static` refuses to skip a gate when
      # `CI` is set, precisely so the pipeline cannot quietly run a smaller set
      # than it reports.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          # The version the docs claim the chart is rendered against, and the one
          # `check:chart` runs locally. A guide that names a version CI does not
          # use is a guide making a promise nobody checks.
          version: v4.2.4

      # Every gate that reads source, as one command. The list and the reason
      # each gate exists live in tooling/scripts/ci-static.mjs, and are rendered
      # as a table in docs/gates.md — so a contributor runs exactly what CI runs
      # instead of a smaller set a shell script happened to name. Twenty-five
      # copied YAML steps were a list only CI knew.
      - name: Static gates
        run: pnpm run ci:static

  # The build, and only the gates that read what it emitted — published .d.ts,
  # the template and ejected-project typechecks, the API surface, the eager-JS
  # budget. Split from `static` because these cannot start before the build
  # finishes and those never need it at all.
  build-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── The console, which this repository can break from here ─────────────
      #
      # `saas/` is a separate, private repository and an importer of THIS
      # workspace: its frontend resolves `@rebasepro/*` to `packages/*/src` in
      # this checkout. So a change made here is a change to the console, and on
      # 2026-09-05 one was — `useTranslation` grew an `i18n` member, and the
      # control plane's CI went red for three consecutive runs from a commit
      # nobody in that repository had made. The producing side is where that
      # should fail.
      #
      # Whether it CAN run depends on a credential this workflow may not have:
      # a fork's pull request never sees repository secrets, and neither does a
      # contributor's clone. The suite is skipped there rather than failing —
      # a private repository must not be a wall in front of an outside
      # contributor — and the step below says so out loud when it skips.
      - name: Can this runner reach the control plane?
        id: saas-access
        env:
          SAAS_REPO_TOKEN: ${{ secrets.SAAS_REPO_TOKEN }}
        run: |
          if [ -n "$SAAS_REPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Before the install, not after: `saas/` holds four importers of this
      # workspace, and `pnpm install` with the directory absent prunes them.
      - name: Checkout the control plane into saas/
        if: steps.saas-access.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: rebasepro/saas
          path: saas
          token: ${{ secrets.SAAS_REPO_TOKEN }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # Every gate that reads build output, as one command — the same move
      # `static` made, for the same reason. These were eleven hand-written YAML
      # steps, which made them a list only CI knew: `verify-quality.sh`, the
      # command CONTRIBUTING and the pull-request template tell you to run
      # before opening a PR, ran none of them, `check:generated` — the one gate
      # CONTRIBUTING explicitly warns about — included.
      #
      # The list and the reason each gate exists live in
      # tooling/scripts/ci-build-gates.mjs, and are rendered as a table in
      # docs/gates.md. `check:gates-doc` fails when a gate is in that table's
      # "after the build" section and in no runner.
      - name: Build gates
        run: pnpm run ci:build-gates

      # Outside the gates array on purpose: `ci:build-gates` refuses to run
      # without build output and is a list of this repository's own checks,
      # while this one depends on a checkout that may not exist.
      - name: Console suite
        if: steps.saas-access.outputs.available == 'true'
        run: pnpm run test:saas-console

      - name: Console suite (skipped)
        if: steps.saas-access.outputs.available != 'true'
        run: |
          echo "::notice::Skipped the Cloud console's suite: no SAAS_REPO_TOKEN on this runner." \
               "A fork's pull request cannot read it. Run \`pnpm test:saas-console\` locally with" \
               "rebasepro/saas checked out at ./saas."

  # The unit suites. `pnpm -r test` runs with --workspace-concurrency=1, so this
  # is ~3.5 minutes of strictly serial work; on its own runner it costs nothing,
  # at the tail of a job it held everything else up.
  #
  # It builds first because that is the order these suites have always run in
  # here. A suite that turns out to read built output would otherwise fail on a
  # source-only runner in a way that reads as a real regression.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # In Los Angeles, not the runner's UTC. A timezone regression test that
      # runs in "whatever zone the machine is in" cannot fail in UTC: the cms
      # date-only fix (b23a4263a) passed here with the fix reverted, and failed
      # only on a laptop east of Greenwich. The developer machines run east, so
      # CI runs west, and between them both halves are exercised. A test that
      # needs one particular zone pins it per file instead (see
      # tooling/scripts/jest/zone-environment.cjs); this is the guard for the
      # ones that do not know they depend on the zone. `verify-quality.sh` sets
      # the same zone.
      #
      # `pnpm test` is `pnpm -r --no-bail …`: every package reports, rather than
      # the first failing one hiding the rest.
      - name: Run tests
        run: pnpm test
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          TZ: America/Los_Angeles

      # The agent harness's own tests. They need neither a database nor a build,
      # and nothing else covers `tooling/scripts/harness/` — including the deploy
      # preflight that .agent/workflows/deployment.md describes. `always()`: a
      # failed unit suite says nothing about these, and must not hide them.
      - name: Harness tests
        if: always()
        run: pnpm run test:harness

  # Scaffolding a project and driving it: `init`, the BaaS template, and the
  # client SDK over a real socket. Playwright is installed because cli-init-e2e
  # captures its screenshots through it — this job uploads them.
  e2e-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Three server-postgres e2e files spawn the CLI and `rebase-server` as child
      # processes, which load built dist, and the CLI suite scaffolds a project
      # that consumes every package as built output (its `assertPackagesBuilt`
      # guard fails otherwise). This job runs on its
      # own runner, so the `checks` job's build does not reach it — build here. Only
      # `./packages/*`, not the admin app, which the e2e never boots.
      - name: Build packages
        run: pnpm --filter './packages/*' -r run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Install Playwright Browsers
        run: |
          # `--with-deps` runs `apt-get update` first, and the runner image
          # ships Google's Chrome repo — whose index has been serving a
          # `Packages.gz` that does not match the hash its own Release file
          # advertises. apt exits non-zero, Playwright reports "Failed to
          # install browsers" and exits 100, and the job dies before a single
          # test runs. It took out e2e-admin and e2e-cli twice in a row on
          # 2026-09-09, with byte-identical hashes both times, so it is not the
          # kind of blip a re-run clears.
          #
          # Nothing here wants that repo: Playwright downloads its own Chromium
          # build from its own CDN, and `--with-deps` only needs apt for the
          # system libraries, which the other sources carry. Dropping the
          # source is narrower than `|| true` on the update — a genuinely
          # broken index for a package we *do* need should still fail.
          # Matched by CONTENT, not filename: the first attempt removed
          # `google-chrome.list` and apt fetched the repo anyway, because
          # ubuntu-24.04 runners declare it in deb822 `.sources` format under a
          # different name. Grep for the host instead of guessing the file.
          for f in $(sudo grep -rl 'dl\.google\.com' /etc/apt/sources.list.d 2>/dev/null || true); do
            echo "Removing apt source that points at Google's CDN: $f"
            sudo rm -f "$f"
          done

          # And if apt is still unhappy, take the browser without the system
          # deps rather than failing the job. The runner image already carries
          # Chromium's shared libraries — every previous green run launched the
          # browser fine — so `--with-deps` refreshing them is a nicety, and a
          # third party's broken index should not gate a release.
          pnpm exec playwright install chromium --with-deps \
            || pnpm exec playwright install chromium

      # CONTRIBUTING's setup executed, then the CMS scaffold, the BaaS scaffold
      # and the client SDK over a real socket — each driver starts its own
      # Postgres, and each suite runs whatever happened to the one before it.
      # As four steps that took an `if: always()` on each, and the first one
      # never had it. The suites, and the reason each exists, are the `cli` lane
      # of tooling/scripts/ci-e2e.mjs, which `verify-quality.sh` runs too.
      - name: CLI and SDK E2E (pnpm ci:e2e --lane cli)
        run: pnpm run ci:e2e --lane cli
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/.artifacts/e2e-screenshots

      - name: Upload E2E Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ github.workspace }}/.artifacts/e2e-screenshots/
          if-no-files-found: ignore

  # The admin panel in a browser, against a database provisioned and seeded here.
  e2e-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Three server-postgres e2e files spawn the CLI and `rebase-server` as child
      # processes, which load built dist, and the CLI suite scaffolds a project
      # that consumes every package as built output (its `assertPackagesBuilt`
      # guard fails otherwise). This job runs on its
      # own runner, so the `checks` job's build does not reach it — build here. Only
      # `./packages/*`, not the admin app, which the e2e never boots.
      - name: Build packages
        run: pnpm --filter './packages/*' -r run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Install Playwright Browsers
        run: |
          # `--with-deps` runs `apt-get update` first, and the runner image
          # ships Google's Chrome repo — whose index has been serving a
          # `Packages.gz` that does not match the hash its own Release file
          # advertises. apt exits non-zero, Playwright reports "Failed to
          # install browsers" and exits 100, and the job dies before a single
          # test runs. It took out e2e-admin and e2e-cli twice in a row on
          # 2026-09-09, with byte-identical hashes both times, so it is not the
          # kind of blip a re-run clears.
          #
          # Nothing here wants that repo: Playwright downloads its own Chromium
          # build from its own CDN, and `--with-deps` only needs apt for the
          # system libraries, which the other sources carry. Dropping the
          # source is narrower than `|| true` on the update — a genuinely
          # broken index for a package we *do* need should still fail.
          # Matched by CONTENT, not filename: the first attempt removed
          # `google-chrome.list` and apt fetched the repo anyway, because
          # ubuntu-24.04 runners declare it in deb822 `.sources` format under a
          # different name. Grep for the host instead of guessing the file.
          for f in $(sudo grep -rl 'dl\.google\.com' /etc/apt/sources.list.d 2>/dev/null || true); do
            echo "Removing apt source that points at Google's CDN: $f"
            sudo rm -f "$f"
          done

          # And if apt is still unhappy, take the browser without the system
          # deps rather than failing the job. The runner image already carries
          # Chromium's shared libraries — every previous green run launched the
          # browser fine — so `--with-deps` refreshing them is a nicety, and a
          # third party's broken index should not gate a release.
          pnpm exec playwright install chromium --with-deps \
            || pnpm exec playwright install chromium

      # The admin panel itself, driven in a browser, against a Postgres the lane
      # starts for itself: `db push`, the seed, then Playwright — with
      # `--fail-on-flaky-tests`, so a test that only passed on a retry fails the
      # job instead of disappearing into the html report. The steps, and the
      # history behind them, are the `admin` lane of tooling/scripts/ci-e2e.mjs,
      # which `verify-quality.sh` runs too.
      - name: Admin panel E2E (pnpm ci:e2e --lane admin)
        run: pnpm run ci:e2e --lane admin

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .artifacts/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Self-host acceptance, the container that ships it, the frozen bundle corpus —
  # and the RLS scan, which has to stay here: it scans `rebase_acceptance`, the
  # database `Self-host acceptance` creates and pushes real DDL into. Split apart,
  # the scan would meet an empty database, and its --min-tables/--min-policies
  # floors would fail every run. That coupling is the only ordering constraint
  # left in this file.
  e2e-selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Three server-postgres e2e files spawn the CLI and `rebase-server` as child
      # processes, which load built dist, and the CLI suite scaffolds a project
      # that consumes every package as built output (its `assertPackagesBuilt`
      # guard fails otherwise). This job runs on its
      # own runner, so the `checks` job's build does not reach it — build here. Only
      # `./packages/*`, not the admin app, which the e2e never boots.
      - name: Build packages
        run: pnpm --filter './packages/*' -r run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # Self-host acceptance, the container that ships it, the frozen bundle
      # corpus, and the RLS scan of the database acceptance pushed real DDL into
      # — in that order, against a Postgres the lane starts for itself, every
      # suite running whatever happened to the one before. The suites, and the
      # reason each exists, are the `selfhost` lane of
      # tooling/scripts/ci-e2e.mjs, which `verify-quality.sh` runs too.
      - name: Self-host E2E (pnpm ci:e2e --lane selfhost)
        run: pnpm run ci:e2e --lane selfhost

  # The security and integration suites. Each test file boots and tears down its
  # own Postgres and the packages run one after another, which makes this the
  # longest single job in the gate — so nothing is scheduled behind it.
  e2e-vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Three server-postgres e2e files spawn the CLI and `rebase-server` as child
      # processes, which load built dist, and the CLI suite scaffolds a project
      # that consumes every package as built output (its `assertPackagesBuilt`
      # guard fails otherwise). This job runs on its
      # own runner, so the `checks` job's build does not reach it — build here. Only
      # `./packages/*`, not the admin app, which the e2e never boots.
      - name: Build packages
        run: pnpm --filter './packages/*' -r run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # One package at a time, each whatever happened to the one before it. This
      # was `pnpm --filter a --filter b --filter c test:e2e`, which stops at the
      # first package that fails: on 2026-09-30 a server-postgres flake meant the
      # RLS scanner's detection fixture and the CLI e2e never ran, and the CLI
      # e2e had a real failure, from the day before, that the flake then hid.
      # No retries (`--retry=0`): a flake fails the run and gets fixed.
      #
      # The suites, and the reason each exists, are the `vitest` lane of
      # tooling/scripts/ci-e2e.mjs — which `verify-quality.sh` runs too. Each
      # file boots its own Postgres (random host port) or PGlite, so this job
      # starts no database of its own.
      - name: Security & integration E2E (pnpm ci:e2e --lane vitest)
        run: pnpm run ci:e2e --lane vitest
