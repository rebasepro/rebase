name: Publish Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump: patch, minor, major, or explicit (e.g. 0.2.0)"
        required: true
        type: string
        default: "patch"
      dry_run:
        description: "Dry run — skip npm publish and GitHub release"
        required: false
        type: boolean
        default: false

concurrency:
  group: stable-publish
  cancel-in-progress: false

jobs:
  publish-stable:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push tags + create release
      id-token: write   # npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog extraction
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Run tests
        run: pnpm test
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # ── Version calculation ─────────────────────────────────
      - name: Determine version
        id: version
        run: |
          CURRENT=$(node -e "console.log(require('./lerna.json').version)")
          BUMP="${{ inputs.version }}"

          if [[ "$BUMP" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="$BUMP"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              *) echo "❌ Invalid bump: $BUMP" && exit 1 ;;
            esac
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Releasing: $CURRENT → $VERSION"

      # ── Extract release notes from CHANGELOG.md ─────────────
      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Try to extract the section for this version from CHANGELOG.md
          # Matches from "## [X.Y.Z]" or "## X.Y.Z" until the next "## " heading
          NOTES=""
          if [ -f "CHANGELOG.md" ]; then
            NOTES=$(awk -v ver="$VERSION" '
              BEGIN { found=0; buf="" }
              /^## / {
                if (found) exit
                # Match ## [X.Y.Z] or ## X.Y.Z (with optional date)
                if ($0 ~ "\\[" ver "\\]" || $0 ~ "^## " ver "[ \t-]" || $0 ~ "^## " ver "$") {
                  found=1
                  next
                }
              }
              found { buf = buf $0 "\n" }
              END { printf "%s", buf }
            ' CHANGELOG.md | sed -e 's/^[[:space:]]*//' -e '/^$/N;/^\n$/d')
          fi

          if [ -n "$NOTES" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$NOTES" > /tmp/release-notes.md
            echo "📝 Found release notes for v$VERSION in CHANGELOG.md"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "📝 No release notes found in CHANGELOG.md — will use GitHub auto-generated notes"
          fi

      # ── Version bump ────────────────────────────────────────
      - name: Bump versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Bump all publishable packages
          pnpm --filter './packages/*' -r exec node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version='$VERSION';
            fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          "

          # Bump lerna.json
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('lerna.json','utf8'));
            p.version='$VERSION';
            fs.writeFileSync('lerna.json',JSON.stringify(p,null,2)+'\n');
          "

          # Commit and tag
          git add -A
          git commit -m "chore: release v$VERSION" --no-verify
          git tag -a "v$VERSION" -m "Release v$VERSION"

      # ── Publish ─────────────────────────────────────────────
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: pnpm --filter './packages/*' -r publish --no-git-checks --access public --report-summary

      - name: Push tags
        if: ${{ !inputs.dry_run }}
        run: git push origin main --follow-tags

      # ── GitHub Release ──────────────────────────────────────
      - name: Create GitHub Release (with CHANGELOG notes)
        if: ${{ !inputs.dry_run && steps.notes.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Create GitHub Release (auto-generated notes)
        if: ${{ !inputs.dry_run && steps.notes.outputs.found == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest

      # ── Summary ─────────────────────────────────────────────
      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "### 🚀 Release v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.current }}\` → \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run:** \`${{ inputs.dry_run }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Release notes:** ${{ steps.notes.outputs.found == 'true' && 'From CHANGELOG.md ✍️' || 'Auto-generated from PRs 🤖' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "**📦 npm:** [@rebasepro packages](https://www.npmjs.com/org/rebasepro)" >> $GITHUB_STEP_SUMMARY
            echo "**🏷 Release:** [v${VERSION}](https://github.com/rebasepro/rebase/releases/tag/v${VERSION})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Install with:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "pnpm add @rebasepro/core@${VERSION}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
