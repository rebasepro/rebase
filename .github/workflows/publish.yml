name: Publish

# One workflow file, two jobs, because npm allows exactly one trusted publisher
# per package: `npm trust github <pkg> --file <one-file>`. Stable and canary
# used to live in publish-stable.yml and publish-canary.yml, which could never
# both be trusted for the same package — the second `npm trust` call collides
# with the first. Keeping both jobs here means one trust config covers both.
#
#   push to main            → canary
#   workflow_dispatch       → stable (or canary, via the channel input)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which release to publish"
        required: false
        type: choice
        options: [stable, canary]
        default: stable
      version:
        description: "Stable only — version bump: patch, minor, major, or explicit (e.g. 0.2.0)"
        required: false
        type: string
        default: "patch"
      dry_run:
        description: "Stable only — dry run: skip npm publish and GitHub release"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

jobs:
  # ══════════════════════════════════════════════════════════════
  # Canary — every push to main, and manual runs with channel=canary
  # ══════════════════════════════════════════════════════════════

  # The same gate a stable release runs, before a canary publishes.
  #
  # Canary used to skip this on the reasoning that "a canary publishes if it
  # compiles, which is what makes it a canary". What that bought in practice was
  # a channel people install from that had passed nothing: canary
  # 0.13.1-canary.gcd6689e went to npm while `check:hooks` was red, and would
  # equally have published with a failing test suite, a broken template or a
  # compose file naming an image nothing publishes. A prerelease is still the
  # place to find problems — but by testing the release, not by shipping one
  # nobody checked.
  verify-canary:
    if: ${{ github.event_name == 'push' || inputs.channel == 'canary' }}
    uses: ./.github/workflows/verify.yml

  publish-canary:
    if: ${{ github.event_name == 'push' || inputs.channel == 'canary' }}
    needs: verify-canary
    runs-on: ubuntu-latest
    # 4 minutes median across 31 runs, 6.4 at the slowest. The ceiling exists
    # because GitHub's default is six hours, and a step that hangs rather than
    # fails holds the runner while the run reports "pending" — which looks
    # exactly like slow. Deliberately ~5x the slowest observed run: this job
    # publishes to npm, and killing it partway leaves some packages published
    # and some not. A ceiling tight enough to do that is worse than none, so it
    # is sized to catch a hang and nothing else.
    timeout-minutes: 30
    concurrency:
      group: canary-publish-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags: the canary version is derived from the last release

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # ── Canary version ──────────────────────────────────────
      # Derived from the last release tag, the same source the stable job reads,
      # so the two cannot disagree about what shipped.
      #
      # The base is the NEXT patch, not the current release: semver orders a
      # prerelease BELOW its own version, so 0.9.0-canary.abc would sort under
      # 0.9.0 and `@canary` would resolve older than `@latest`. 0.9.1-canary.abc
      # sorts above 0.9.0 and below a future 0.9.1, which is what a build of
      # "main since 0.9.0" should mean. Ranges like ^0.9.0 still never select it
      # — semver excludes prereleases unless the range names one.
      - name: Set canary version
        run: |
          # `g` for git, as in `git describe` (v1.0.0-2-gabc1234).
          #
          # It is not decoration. A semver prerelease identifier made only of
          # digits is a NUMERIC identifier, and numeric identifiers may not carry
          # a leading zero — so a commit whose short sha happens to be all digits
          # starting with 0 produces an invalid version and the whole canary
          # publish dies with `invalid semver`. That is roughly one commit in
          # every few hundred, which is exactly often enough to look random and
          # rare enough that nobody connects it to the sha. It happened on
          # 0946568. The prefix makes the identifier alphanumeric every time.
          SHORT_SHA="g$(echo "${{ github.sha }}" | cut -c1-7)"

          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            # No release yet: 0.0.1-canary.x, which is what canary published
            # before it tracked releases at all.
            BASE="0.0.0"
            echo "No release tag found — basing canary on $BASE"
          else
            BASE="${LATEST_TAG#v}"
            echo "Last release: $LATEST_TAG"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          CANARY_VERSION="${NEXT}-canary.${SHORT_SHA}"

          echo "CANARY_VERSION=$CANARY_VERSION" >> $GITHUB_ENV
          echo "Publishing canary version: $CANARY_VERSION"

          # Bump every publishable package. The set is DERIVED from the workspace
          # (see tooling/scripts/publishable-packages.mjs); it used to be two
          # `--filter` paths, and when one of those directories moved pnpm matched
          # nothing, exited 0, and quietly dropped a package from four releases.
          node tooling/scripts/publishable-packages.mjs --set-version "$CANARY_VERSION"

          # Commit version changes locally so pnpm publish doesn't complain about dirty git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: canary version $CANARY_VERSION" --no-verify

      # Fail here rather than at the registry. `check:publishable-set` re-derives
      # the set from the workspace and refuses to go on unless every publishable
      # package sits at the version this release claims — which is precisely what
      # nothing checked when `@rebasepro/agent-skills` was left four versions
      # behind and its stale number was baked into the CLI's published manifest.
      - name: Every publishable package is at this version
        run: node tooling/scripts/check-publishable-set.mjs

      - name: Validate no workspace protocol in packed output
        run: |
          echo "Packing and validating all publishable packages..."
          PACK_DIR=$(mktemp -d)
          trap 'rm -rf "$PACK_DIR"' EXIT
          ERRORS=0

          for pkg_dir in $(node tooling/scripts/publishable-packages.mjs --dirs); do
            [ -f "$pkg_dir/package.json" ] || continue
            pkg_name=$(node -e "console.log(require('./$pkg_dir/package.json').name)")

            (cd "$pkg_dir" && pnpm pack --pack-destination "$PACK_DIR") > /dev/null 2>&1
            tarball=$(ls -t "$PACK_DIR"/*.tgz 2>/dev/null | head -1)
            if [ -n "$tarball" ]; then
              packed=$(tar -xzf "$tarball" -O package/package.json 2>/dev/null)
              if echo "$packed" | grep -q '"workspace:'; then
                echo "❌ $pkg_name has workspace: references in packed tarball!"
                echo "$packed" | grep '"workspace:'
                ERRORS=$((ERRORS + 1))
              else
                echo "✅ $pkg_name"
              fi
              rm -f "$tarball"
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS package(s) have workspace: references. ABORTING."
            exit 1
          fi
          echo "✅ All packages clean — safe to publish."

      # No NODE_AUTH_TOKEN. pnpm exchanges the OIDC id-token (granted by the
      # id-token: write permission above) for a short-lived registry token,
      # against the trusted publisher each package has for this workflow file.
      # A token here would be a standing credential doing what OIDC already
      # does per-run, and pnpm prefers it, so its presence would silently mask
      # a broken trust config.
      - name: Publish to npm
        run: |
          # No `--filter`. `pnpm -r publish` already publishes exactly the
          # non-private workspace members, wherever in the tree they live, so
          # there is nothing here for a directory move to invalidate.
          pnpm -r publish --tag canary --no-git-checks --access public --report-summary

      - name: Summary
        run: |
          echo "### 🐤 Canary Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ env.CANARY_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pnpm add @rebasepro/app@canary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # Stable — manual runs only
  # ══════════════════════════════════════════════════════════════

  # A stable release runs the whole gate first, on the exact commit being released:
  # type checks, the headless/BaaS guards, the init-template check, unit tests, and
  # every e2e suite. `publish-stable` needs it, so a failure anywhere stops the
  # release before a version is bumped, a tag is pushed, or anything reaches npm.
  #
  # This is the same workflow CI runs, called rather than copied — a second copy of
  # the step list on the path that runs least often is how a release gate rots.
  #
  # Canary is untouched and still publishes on a green build alone.
  verify-stable:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' }}
    uses: ./.github/workflows/verify.yml

  publish-stable:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' }}
    needs: verify-stable
    runs-on: ubuntu-latest
    # Higher than publish-canary, and not because it is observed to be slower:
    # there is exactly one successful run to measure (11.7 minutes), and it does
    # strictly more — publishes to npm, commits and pushes a tag, then builds
    # and pushes a multi-arch image. So both the true spread and the cost of a
    # mistimed kill are larger here: interrupted between the npm publish and the
    # tag, a release exists on the registry with nothing in git pointing at it.
    timeout-minutes: 75
    concurrency:
      group: stable-publish
      cancel-in-progress: false
    permissions:
      contents: write   # push tags + create release
      id-token: write   # npm provenance, and the token exchanged for Artifact Registry

    # The registry Rebase Cloud pulls from. Named here rather than inline because
    # three steps have to agree on it, and because the one thing worse than a
    # release that cannot push to it is a release that pushes somewhere else.
    env:
      FLEET_REGISTRY: europe-west1-docker.pkg.dev
      FLEET_IMAGE: europe-west1-docker.pkg.dev/rebase-578f2/rebase-saas-images/rebasepro/server

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog extraction
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # ── Credentials, before anything irreversible ───────────────
      #
      # The registry pushes happen near the end of this job, after npm publish
      # and after the version-bump commit and tag are pushed to main. Both of
      # those are one-way: a version cannot be unpublished from npm, and the tag
      # is already on the branch. So a release with no registry credentials did
      # not fail — it half-succeeded, leaving npm and git carrying a version
      # whose `docker-compose.yml` names an image that was never built.
      #
      # That is exactly the state 0.13.0 shipped in, and `check:runtime-image`
      # cannot catch it: it asserts that an automated workflow publishes the
      # image, which has been true since that job was added. A workflow that
      # cannot authenticate still counts as one. Only the release itself can see
      # whether the secret exists, and the only useful moment is before the first
      # irreversible step.
      #
      # Two registries, two credentials, one check. Docker Hub carries the public
      # tags a self-hoster pulls; Artifact Registry carries the private tag the
      # managed fleet pulls. Both are checked here because a release that reaches
      # only one of them is the failure this whole step exists to prevent — and
      # the fleet half is the one that used to be missing entirely: 0.14.0,
      # 0.14.1 and 0.15.0 all published to npm and Docker Hub while the newest
      # image the fleet could see stayed at 0.13.0, because pushing it was a
      # `gcloud builds submit` somebody had to remember to type.
      - name: Check release credentials
        if: ${{ !inputs.dry_run }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_RELEASE_SERVICE_ACCOUNT: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT }}
        run: |
          hub_missing=""
          [ -n "$DOCKERHUB_USERNAME" ] || hub_missing="$hub_missing DOCKERHUB_USERNAME"
          [ -n "$DOCKERHUB_TOKEN" ] || hub_missing="$hub_missing DOCKERHUB_TOKEN"

          fleet_missing=""
          [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] || fleet_missing="$fleet_missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -n "$GCP_RELEASE_SERVICE_ACCOUNT" ] || fleet_missing="$fleet_missing GCP_RELEASE_SERVICE_ACCOUNT"

          if [ -n "$hub_missing" ]; then
            echo "::error::Missing Docker Hub secret(s):$hub_missing"
            echo ""
            echo "This release would publish to npm and push a tag, then fail at the Docker Hub"
            echo "login — leaving a version whose scaffolded docker-compose.yml pulls"
            echo "rebasepro/server:<version>, an image that would not exist, and whose Kubernetes"
            echo "guide names a chart nobody pushed. Stopping first."
            echo ""
            echo "Set them once, then re-run:"
            echo "  gh secret set DOCKERHUB_USERNAME -R ${{ github.repository }}"
            echo "  gh secret set DOCKERHUB_TOKEN    -R ${{ github.repository }}"
            echo ""
            echo "The token needs Read & Write on rebasepro/server, and on the rebasepro"
            echo "namespace for the OCI chart."
          fi

          if [ -n "$fleet_missing" ]; then
            echo "::error::Missing Artifact Registry secret(s):$fleet_missing"
            echo ""
            echo "Without these the release publishes to npm and Docker Hub and the managed"
            echo "fleet never sees the version at all: Rebase Cloud resolves deploys against"
            echo "images in the private Artifact Registry, so a version that is not pushed"
            echo "there cannot be registered as a runtime release and cannot be rolled out."
            echo ""
            echo "Set up the federated identity once — it creates the pool, the provider and"
            echo "the service account, and prints the two commands below:"
            echo "  ./tooling/scripts/setup-release-wif.sh"
            echo ""
            echo "Then:"
            echo "  gh secret set GCP_WORKLOAD_IDENTITY_PROVIDER -R ${{ github.repository }}"
            echo "  gh secret set GCP_RELEASE_SERVICE_ACCOUNT    -R ${{ github.repository }}"
          fi

          if [ -n "$hub_missing" ] || [ -n "$fleet_missing" ]; then
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build only. The tests that used to run here — and every e2e suite besides —
      # now run in `verify-stable`, which this job needs, so getting this far means
      # they already passed on this commit. This build is for the artifacts being
      # published, not a check.
      - name: Build packages
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # ── Version calculation ─────────────────────────────────
      - name: Determine version
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            echo "❌ No semver tags found. Create an initial tag first: git tag -a v0.0.0 -m 'Initial version'"
            exit 1
          fi

          CURRENT="${LATEST_TAG#v}"
          BUMP="${{ inputs.version }}"

          if [[ "$BUMP" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="$BUMP"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              *) echo "❌ Invalid bump: $BUMP" && exit 1 ;;
            esac
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Releasing: $CURRENT → $VERSION (from tag $LATEST_TAG)"

      # ── The bump has to match what the release did ──────────
      #
      # `inputs.version` is free text defaulting to "patch", correlated with
      # nothing. A release that removed an export from @rebasepro/server therefore
      # shipped as 0.13.1, and `^0.13.0` — the range `rebase init` scaffolds —
      # means >=0.13.0 <0.14.0, so it auto-installed for every consumer on their
      # next `pnpm install`. This asks the committed contract baselines what the
      # release actually did and refuses a breaking one that is not at least a
      # minor with a declared `### Breaking` section. Before "Stamp changelog" on
      # purpose: the section it reads is still `[Unreleased]` at this point.
      - name: Bump level matches the diff
        run: node tooling/scripts/check-release-bump.mjs "${{ steps.version.outputs.version }}" --from "v${{ steps.version.outputs.current }}"

      # ── Stamp changelog ─────────────────────────────────────
      # Promote "## [Unreleased]" → "## [VERSION] - <date>", open a fresh
      # [Unreleased], and sync the docs-site mirror. Committed back to main by
      # the "Commit version bump" step below (skipped on dry runs). This is why
      # contributors only ever maintain the [Unreleased] section by hand.
      - name: Stamp changelog
        run: node tooling/scripts/prepare-changelog.mjs "${{ steps.version.outputs.version }}"

      # ── Extract release notes from CHANGELOG.md ─────────────
      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Try to extract the section for this version from CHANGELOG.md
          # Matches from "## [X.Y.Z]" or "## X.Y.Z" until the next "## " heading
          NOTES=""
          if [ -f "CHANGELOG.md" ]; then
            NOTES=$(awk -v ver="$VERSION" '
              BEGIN { found=0; buf="" }
              /^## / {
                if (found) exit
                # Match ## [X.Y.Z] or ## X.Y.Z (with optional date)
                if ($0 ~ "\\[" ver "\\]" || $0 ~ "^## " ver "[ \t-]" || $0 ~ "^## " ver "$") {
                  found=1
                  next
                }
              }
              found { buf = buf $0 "\n" }
              END { printf "%s", buf }
            ' CHANGELOG.md | sed -e 's/^[[:space:]]*//' -e '/^$/N;/^\n$/d')
          fi

          if [ -n "$NOTES" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$NOTES" > /tmp/release-notes.md
            echo "📝 Found release notes for v$VERSION in CHANGELOG.md"
          else
            echo "❌ No release notes found for v$VERSION in CHANGELOG.md. Release notes are required to continue."
            exit 1
          fi

      # ── Version bump ──────────────────────────────────────────
      - name: Bump versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Bump every publishable package. The set is DERIVED from the workspace
          # (see tooling/scripts/publishable-packages.mjs) rather than listed here.
          node tooling/scripts/publishable-packages.mjs --set-version "$VERSION"

          # The chart ships with the runtime and its appVersion IS the default
          # image tag, so it has to move with them — see tooling/scripts/release.sh,
          # which stamps it in the same place for the same reason. Left behind,
          # `helm install` with no `image.tag` renders the previous version and
          # `check:runtime-image` fails on the next run.
          node -e "
            const fs=require('fs');
            const f='infra/charts/rebase/Chart.yaml';
            let t=fs.readFileSync(f,'utf8');
            const before=t;
            t=t.replace(/^version:.*\$/m, 'version: $VERSION');
            t=t.replace(/^appVersion:.*\$/m, 'appVersion: \"$VERSION\"');
            if (t===before) { console.error('Chart.yaml: neither version nor appVersion matched'); process.exit(1); }
            fs.writeFileSync(f,t);
          "

      # ── Pre-publish validation ───────────────────────────────

      # Fail here rather than at the registry. `check:publishable-set` re-derives
      # the set from the workspace and refuses to go on unless every publishable
      # package sits at the version this release claims — which is precisely what
      # nothing checked when `@rebasepro/agent-skills` was left four versions
      # behind and its stale number was baked into the CLI's published manifest.
      - name: Every publishable package is at this version
        run: node tooling/scripts/check-publishable-set.mjs

      - name: Validate no workspace protocol in packed output
        run: |
          echo "Packing and validating all publishable packages..."
          PACK_DIR=$(mktemp -d)
          trap 'rm -rf "$PACK_DIR"' EXIT
          ERRORS=0

          for pkg_dir in $(node tooling/scripts/publishable-packages.mjs --dirs); do
            [ -f "$pkg_dir/package.json" ] || continue
            pkg_name=$(node -e "console.log(require('./$pkg_dir/package.json').name)")

            (cd "$pkg_dir" && pnpm pack --pack-destination "$PACK_DIR") > /dev/null 2>&1
            tarball=$(ls -t "$PACK_DIR"/*.tgz 2>/dev/null | head -1)
            if [ -n "$tarball" ]; then
              packed=$(tar -xzf "$tarball" -O package/package.json 2>/dev/null)
              if echo "$packed" | grep -q '"workspace:'; then
                echo "❌ $pkg_name has workspace: references in packed tarball!"
                echo "$packed" | grep '"workspace:'
                ERRORS=$((ERRORS + 1))
              else
                echo "✅ $pkg_name"
              fi
              rm -f "$tarball"
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS package(s) have workspace: references. ABORTING."
            exit 1
          fi
          echo "✅ All packages clean — safe to publish."

      # ── Publish ─────────────────────────────────────────────
      # No NODE_AUTH_TOKEN — see the canary job's publish step.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: |
          # No `--filter` — see the canary job's publish step.
          pnpm -r publish --no-git-checks --access public --report-summary

      - name: Commit version bump, tag, and push
        id: bump
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Commit the version bumps back to main
          git add -A
          git commit -m "chore: bump version to $VERSION [skip ci]"

          # Create the release tag on the version-bump commit
          git tag -a "v$VERSION" -m "Release v$VERSION"

          # Push both the commit and the tag
          git push origin main --follow-tags

          # The fleet tag names the COMMIT, not the marketing version, so two
          # builds of different source can never collide on one name. That commit
          # is this one — the one `v$VERSION` points at — and not
          # `github.sha`, which is the checkout from before the bump.
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ── Self-host runtime image ─────────────────────────────
      #
      # `rebasepro/server` is the image the scaffolded `docker-compose.yml` tells
      # every new project to pull, with `REBASE_VERSION` pinned to the version
      # released just above. Until this step existed nothing published it on a
      # release: `cloudbuild-runtime.yaml` has had a Docker Hub push for months,
      # but it runs only when a human types `gcloud builds submit`, and nobody did.
      # So 0.13.0 shipped a compose file whose first command ends at
      # `pull access denied for rebasepro/server, repository does not exist`.
      #
      # It publishes AFTER npm and the tag on purpose. The image installs the
      # framework from a bundle's own `deps.declared` at boot, so a self-hoster's
      # first boot resolves `@rebasepro/*` from npm — building the image before
      # those versions exist would produce one that cannot boot the release it is
      # named after.
      #
      # One build, three tags, two registries — so the artifact a self-hoster
      # pulls and the artifact Rebase Cloud runs are the same bytes under the
      # same digest. This used to be two builds from the same commit, and the
      # comment here conceded the point: "same source, different digest", with a
      # note to replace it with a federated push if the single digest was ever
      # wanted back. It is wanted back, and the reason is not tidiness. The
      # managed fleet pins by digest, and a digest that no public artifact shares
      # means "you can run what we run" was true of the source and not of the
      # image.
      #
      # It also closes the gap that left the fleet three versions behind. The
      # private tag was only ever pushed by `gcloud builds submit` typed by hand,
      # so npm and Docker Hub moved to 0.15.0 while the newest image the control
      # plane could resolve stayed at 0.13.0. Nothing reported that, because
      # nothing was broken — the step simply did not exist.
      - name: Set up Docker Buildx
        if: ${{ !inputs.dry_run }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Federated, so no service-account key exists to leak or rotate. The job
      # already asks for `id-token: write` for npm provenance, which is the same
      # token this exchanges. `./tooling/scripts/setup-release-wif.sh` creates the pool,
      # the provider and the service account, and scopes the trust to this
      # repository — a token minted by any other repository is refused by the
      # provider's attribute condition, not by anything here.
      - name: Authenticate to Google Cloud
        id: gcp-auth
        if: ${{ !inputs.dry_run }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.FLEET_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      # For the post-push verification below, which asks the registry what the
      # tag resolves to. Installed explicitly rather than relying on the runner
      # image happening to carry gcloud — the verification is the step that would
      # silently stop verifying.
      - name: Set up gcloud
        if: ${{ !inputs.dry_run }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the runtime image
        id: image
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/server.Dockerfile
          # linux/arm64 as well as amd64: a self-hoster on Apple silicon running
          # `docker compose up` gets qemu emulation without it, which is slow
          # enough to read as a hang on first boot.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            rebasepro/server:${{ steps.version.outputs.version }}
            rebasepro/server:latest
            ${{ env.FLEET_IMAGE }}:${{ steps.version.outputs.version }}-${{ steps.bump.outputs.sha }}
          # The compose file resolves `${REBASE_VERSION:-latest}`, so `latest`
          # has to keep moving or a project that clears the variable pulls
          # whatever the first release ever pushed.
          #
          # The fleet tag carries a commit and no `latest`, for the opposite
          # reason: the control plane registers a release by digest and a moving
          # tag there would silently change what a running fleet is pinned to.

      # Publishing is not the same as being pullable. Ask the registry, from
      # outside, with no credentials — the way a self-hoster's daemon will.
      - name: Verify the image is pullable
        if: ${{ !inputs.dry_run }}
        run: node tooling/scripts/check-runtime-image.mjs --live --version "${{ steps.version.outputs.version }}"

      # The same claim for the private tag, asked of the registry rather than of
      # the build log — which says "naming to <tag> done" for a purely local
      # tagging step, and has read as a successful push before.
      - name: Verify the fleet image is in Artifact Registry
        if: ${{ !inputs.dry_run }}
        env:
          FLEET_TAG: ${{ steps.version.outputs.version }}-${{ steps.bump.outputs.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          FOUND=$(gcloud artifacts docker tags list "$FLEET_IMAGE" \
            --filter="tag:$FLEET_TAG" --format="value(version)" 2>/dev/null | head -n1)
          if [ -z "$FOUND" ]; then
            echo "::error::$FLEET_IMAGE:$FLEET_TAG is not in Artifact Registry."
            exit 1
          fi
          if [ "$FOUND" != "$DIGEST" ]; then
            echo "::error::$FLEET_TAG resolves to $FOUND, but this build produced $DIGEST."
            exit 1
          fi
          echo "$FLEET_IMAGE:$FLEET_TAG → $DIGEST"

      # ── Tell the cloud the image exists ─────────────────────
      #
      # Pushing an image changes nothing about Rebase Cloud. The fleet schedules
      # onto rows in `runtime_releases`, and until a row exists a published image
      # is invisible to every project — which is how 0.14.0, 0.14.1 and 0.15.0
      # were all published while the managed fleet ran 0.13.0 for three weeks.
      # Writing that row was a human typing two commands afterwards.
      #
      # This does NOT send the release; it asks the control plane to look. The
      # `release-intake` cron reconciles Artifact Registry against
      # `runtime_releases` on its own every 15 minutes, and this trigger only
      # collapses that latency to zero. So the request carries no body, cannot
      # register anything the control plane would not have registered by itself,
      # and its worst case is one wasted registry read.
      #
      # Registering is not rolling: existing projects stay where they are until
      # someone runs `release:runtime --roll`. This makes the release VISIBLE.
      - name: Ask the control plane to pick up the new image
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          CP_URL: ${{ vars.REBASE_CONTROL_PLANE_URL || 'https://api.rebase.pro' }}
          CP_KEY: ${{ secrets.REBASE_CONTROL_PLANE_ADMIN_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${CP_KEY:-}" ]; then
            echo "::warning::REBASE_CONTROL_PLANE_ADMIN_KEY is not set — skipping the intake trigger."
            echo "The release-intake cron will pick this image up within 15 minutes on its own."
            echo "To make it immediate:  gh secret set REBASE_CONTROL_PLANE_ADMIN_KEY -R ${{ github.repository }}"
            exit 0
          fi
          code=$(curl -sS -o /tmp/intake.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CP_KEY" \
            --max-time 60 \
            "$CP_URL/api/cron/release-intake/trigger" || echo "000")
          echo "control plane answered $code"
          head -c 600 /tmp/intake.json 2>/dev/null || true
          echo
          # Deliberately not a release-blocking failure. The image is pushed and
          # verified; the cron closes this within 15 minutes regardless, so
          # failing the release over a trigger would trade a real artifact for a
          # latency improvement.
          if [ "$code" != "200" ]; then
            echo "::warning::Intake trigger did not succeed ($code). The release-intake cron will still register this image."
          fi

      # ── Helm chart ──────────────────────────────────────────
      #
      # The chart is the Kubernetes half of the same promise the image makes, and
      # it shipped reachable only by cloning the repository — which is exactly
      # the state the image was in when 0.13.0 went out with `pull access denied`
      # as the first thing a new self-hoster saw. Pushed as an OCI artifact to
      # the same registry, under the same credentials, in the same job, so the
      # two cannot drift apart by one of them failing quietly.
      - name: Set up Helm
        if: ${{ !inputs.dry_run }}
        uses: azure/setup-helm@v4
        with:
          # The version the docs claim the chart is rendered against, and the one
          # `check:chart` runs locally. A guide that names a version CI does not
          # use is a guide making a promise nobody checks.
          version: v4.2.4

      - name: Package and push the Helm chart
        if: ${{ !inputs.dry_run }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # helm keeps its own registry credentials; the docker login above does
          # not reach it.
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io \
            --username "$DOCKERHUB_USERNAME" --password-stdin
          helm package infra/charts/rebase --destination /tmp/chart
          helm push "/tmp/chart/rebase-${VERSION}.tgz" oci://registry-1.docker.io/rebasepro

      # Same reasoning as the image: a push that reported success and an artifact
      # a stranger can actually pull are different claims.
      - name: Verify the chart is pullable
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          helm registry logout registry-1.docker.io || true
          # helm writes the tarball through a temp file *inside* --destination
          # and does not create that directory: without this the pull succeeds,
          # prints the digest, and then dies on
          # "open /tmp/chart-verify/rebase-<v>.tgz<random>: no such file or
          # directory" — which reads as an unpullable chart and failed the 0.16.0
          # release *after* npm, the tag and both images had already gone out.
          mkdir -p /tmp/chart-verify
          helm pull oci://registry-1.docker.io/rebasepro/rebase \
            --version "$VERSION" --destination /tmp/chart-verify
          test -f "/tmp/chart-verify/rebase-${VERSION}.tgz"

      # ── GitHub Release ──────────────────────────────────────
      - name: Create GitHub Release (with CHANGELOG notes)
        if: ${{ !inputs.dry_run && steps.notes.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Create GitHub Release (auto-generated notes)
        if: ${{ !inputs.dry_run && steps.notes.outputs.found == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest

      # ── Summary ─────────────────────────────────────────────
      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "### 🚀 Release v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.current }}\` → \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run:** \`${{ inputs.dry_run }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Release notes:** ${{ steps.notes.outputs.found == 'true' && 'From CHANGELOG.md ✍️' || 'Auto-generated from PRs 🤖' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "**📦 npm:** [@rebasepro packages](https://www.npmjs.com/org/rebasepro)" >> $GITHUB_STEP_SUMMARY
            echo "**🏷 Release:** [v${VERSION}](https://github.com/rebasepro/rebase/releases/tag/v${VERSION})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Install with:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "pnpm add @rebasepro/app@${VERSION}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Publishing an image is not the same as the fleet running it. The
            # control plane schedules onto `runtime_releases` rows, so a release
            # nobody registers is a release Rebase Cloud cannot see — which is
            # the state 0.14.0 through 0.15.0 are in. The command that ends that
            # is short, and printing it here is the difference between a step
            # somebody remembers and a step somebody reads.
            FLEET_TAG="${VERSION}-${{ steps.bump.outputs.sha }}"
            echo "### 🛰 Rebase Cloud — not rolled out yet" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The fleet image is published, but no managed project runs it until a" >> $GITHUB_STEP_SUMMARY
            echo "runtime release is registered and a rollout is started:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| | |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Fleet tag | \`${FLEET_TAG}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Digest | \`${{ steps.image.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "From \`saas/backend\`, with a port-forward to the control plane open" >> $GITHUB_STEP_SUMMARY
            echo "(\`../scripts/dev-prod.sh\`):" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "pnpm release:runtime --image-tag=${FLEET_TAG}          # what it would do" >> $GITHUB_STEP_SUMMARY
            echo "pnpm release:runtime --image-tag=${FLEET_TAG} --roll --apply" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
