name: Publish

# One workflow file, two jobs, because npm allows exactly one trusted publisher
# per package: `npm trust github <pkg> --file <one-file>`. Stable and canary
# used to live in publish-stable.yml and publish-canary.yml, which could never
# both be trusted for the same package — the second `npm trust` call collides
# with the first. Keeping both jobs here means one trust config covers both.
#
#   push to main            → canary
#   workflow_dispatch       → stable (or canary, via the channel input)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which release to publish"
        required: false
        type: choice
        options: [stable, canary]
        default: stable
      version:
        description: "Stable only — version bump: patch, minor, major, or explicit (e.g. 0.2.0)"
        required: false
        type: string
        default: "patch"
      dry_run:
        description: "Stable only — dry run: skip npm publish and GitHub release"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

jobs:
  # ══════════════════════════════════════════════════════════════
  # Canary — every push to main, and manual runs with channel=canary
  # ══════════════════════════════════════════════════════════════

  # The same gate a stable release runs, before a canary publishes.
  #
  # Canary used to skip this on the reasoning that "a canary publishes if it
  # compiles, which is what makes it a canary". What that bought in practice was
  # a channel people install from that had passed nothing: canary
  # 0.13.1-canary.gcd6689e went to npm while `check:hooks` was red, and would
  # equally have published with a failing test suite, a broken template or a
  # compose file naming an image nothing publishes. A prerelease is still the
  # place to find problems — but by testing the release, not by shipping one
  # nobody checked.
  verify-canary:
    if: ${{ github.event_name == 'push' || inputs.channel == 'canary' }}
    uses: ./.github/workflows/verify.yml

  publish-canary:
    if: ${{ github.event_name == 'push' || inputs.channel == 'canary' }}
    needs: verify-canary
    runs-on: ubuntu-latest
    concurrency:
      group: canary-publish-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags: the canary version is derived from the last release

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # ── Canary version ──────────────────────────────────────
      # Derived from the last release tag, the same source the stable job reads,
      # so the two cannot disagree about what shipped.
      #
      # The base is the NEXT patch, not the current release: semver orders a
      # prerelease BELOW its own version, so 0.9.0-canary.abc would sort under
      # 0.9.0 and `@canary` would resolve older than `@latest`. 0.9.1-canary.abc
      # sorts above 0.9.0 and below a future 0.9.1, which is what a build of
      # "main since 0.9.0" should mean. Ranges like ^0.9.0 still never select it
      # — semver excludes prereleases unless the range names one.
      - name: Set canary version
        run: |
          # `g` for git, as in `git describe` (v1.0.0-2-gabc1234).
          #
          # It is not decoration. A semver prerelease identifier made only of
          # digits is a NUMERIC identifier, and numeric identifiers may not carry
          # a leading zero — so a commit whose short sha happens to be all digits
          # starting with 0 produces an invalid version and the whole canary
          # publish dies with `invalid semver`. That is roughly one commit in
          # every few hundred, which is exactly often enough to look random and
          # rare enough that nobody connects it to the sha. It happened on
          # 0946568. The prefix makes the identifier alphanumeric every time.
          SHORT_SHA="g$(echo "${{ github.sha }}" | cut -c1-7)"

          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            # No release yet: 0.0.1-canary.x, which is what canary published
            # before it tracked releases at all.
            BASE="0.0.0"
            echo "No release tag found — basing canary on $BASE"
          else
            BASE="${LATEST_TAG#v}"
            echo "Last release: $LATEST_TAG"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          CANARY_VERSION="${NEXT}-canary.${SHORT_SHA}"

          echo "CANARY_VERSION=$CANARY_VERSION" >> $GITHUB_ENV
          echo "Publishing canary version: $CANARY_VERSION"

          # Bump version in all publishable packages (node, not npm, to avoid workspace:* validation)
          pnpm --filter './packages/*' --filter './rebase-agent-skills' -r exec node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$CANARY_VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

          # Commit version changes locally so pnpm publish doesn't complain about dirty git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: canary version $CANARY_VERSION" --no-verify

      - name: Validate no workspace protocol in packed output
        run: |
          echo "Packing and validating all publishable packages..."
          PACK_DIR=$(mktemp -d)
          trap 'rm -rf "$PACK_DIR"' EXIT
          ERRORS=0

          for pkg_dir in packages/*/ rebase-agent-skills/; do
            [ -f "$pkg_dir/package.json" ] || continue
            is_private=$(node -e "console.log(require('./$pkg_dir/package.json').private || false)")
            [ "$is_private" = "true" ] && continue
            pkg_name=$(node -e "console.log(require('./$pkg_dir/package.json').name)")

            (cd "$pkg_dir" && pnpm pack --pack-destination "$PACK_DIR") > /dev/null 2>&1
            tarball=$(ls -t "$PACK_DIR"/*.tgz 2>/dev/null | head -1)
            if [ -n "$tarball" ]; then
              packed=$(tar -xzf "$tarball" -O package/package.json 2>/dev/null)
              if echo "$packed" | grep -q '"workspace:'; then
                echo "❌ $pkg_name has workspace: references in packed tarball!"
                echo "$packed" | grep '"workspace:'
                ERRORS=$((ERRORS + 1))
              else
                echo "✅ $pkg_name"
              fi
              rm -f "$tarball"
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS package(s) have workspace: references. ABORTING."
            exit 1
          fi
          echo "✅ All packages clean — safe to publish."

      # No NODE_AUTH_TOKEN. pnpm exchanges the OIDC id-token (granted by the
      # id-token: write permission above) for a short-lived registry token,
      # against the trusted publisher each package has for this workflow file.
      # A token here would be a standing credential doing what OIDC already
      # does per-run, and pnpm prefers it, so its presence would silently mask
      # a broken trust config.
      - name: Publish to npm
        run: pnpm --filter './packages/*' --filter './rebase-agent-skills' -r publish --tag canary --no-git-checks --access public --report-summary

      - name: Summary
        run: |
          echo "### 🐤 Canary Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ env.CANARY_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pnpm add @rebasepro/app@canary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # Stable — manual runs only
  # ══════════════════════════════════════════════════════════════

  # A stable release runs the whole gate first, on the exact commit being released:
  # type checks, the headless/BaaS guards, the init-template check, unit tests, and
  # every e2e suite. `publish-stable` needs it, so a failure anywhere stops the
  # release before a version is bumped, a tag is pushed, or anything reaches npm.
  #
  # This is the same workflow CI runs, called rather than copied — a second copy of
  # the step list on the path that runs least often is how a release gate rots.
  #
  # Canary is untouched and still publishes on a green build alone.
  verify-stable:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' }}
    uses: ./.github/workflows/verify.yml

  publish-stable:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' }}
    needs: verify-stable
    runs-on: ubuntu-latest
    concurrency:
      group: stable-publish
      cancel-in-progress: false
    permissions:
      contents: write   # push tags + create release
      id-token: write   # npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog extraction
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # ── Credentials, before anything irreversible ───────────────
      #
      # The Docker Hub push happens near the end of this job, after npm publish
      # and after the version-bump commit and tag are pushed to main. Both of
      # those are one-way: a version cannot be unpublished from npm, and the tag
      # is already on the branch. So a release with no Docker Hub credentials did
      # not fail — it half-succeeded, leaving npm and git carrying a version
      # whose `docker-compose.yml` names an image that was never built.
      #
      # That is exactly the state 0.13.0 shipped in, and `check:runtime-image`
      # cannot catch it: it asserts that an automated workflow publishes the
      # image, which has been true since that job was added. A workflow that
      # cannot authenticate still counts as one. Only the release itself can see
      # whether the secret exists, and the only useful moment is before the first
      # irreversible step.
      - name: Check release credentials
        if: ${{ !inputs.dry_run }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$DOCKERHUB_USERNAME" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "$DOCKERHUB_TOKEN" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo ""
            echo "This release would publish to npm and push a tag, then fail at the Docker Hub"
            echo "login — leaving a version whose scaffolded docker-compose.yml pulls"
            echo "rebasepro/server:<version>, an image that would not exist. Stopping first."
            echo ""
            echo "Set them once, then re-run:"
            echo "  gh secret set DOCKERHUB_USERNAME -R ${{ github.repository }}"
            echo "  gh secret set DOCKERHUB_TOKEN    -R ${{ github.repository }}"
            echo ""
            echo "The token needs Read & Write on the rebasepro/server repository."
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build only. The tests that used to run here — and every e2e suite besides —
      # now run in `verify-stable`, which this job needs, so getting this far means
      # they already passed on this commit. This build is for the artifacts being
      # published, not a check.
      - name: Build packages
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # ── Version calculation ─────────────────────────────────
      - name: Determine version
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            echo "❌ No semver tags found. Create an initial tag first: git tag -a v0.0.0 -m 'Initial version'"
            exit 1
          fi

          CURRENT="${LATEST_TAG#v}"
          BUMP="${{ inputs.version }}"

          if [[ "$BUMP" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="$BUMP"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              *) echo "❌ Invalid bump: $BUMP" && exit 1 ;;
            esac
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Releasing: $CURRENT → $VERSION (from tag $LATEST_TAG)"

      # ── Stamp changelog ─────────────────────────────────────
      # Promote "## [Unreleased]" → "## [VERSION] - <date>", open a fresh
      # [Unreleased], and sync the docs-site mirror. Committed back to main by
      # the "Commit version bump" step below (skipped on dry runs). This is why
      # contributors only ever maintain the [Unreleased] section by hand.
      - name: Stamp changelog
        run: node scripts/prepare-changelog.mjs "${{ steps.version.outputs.version }}"

      # ── Extract release notes from CHANGELOG.md ─────────────
      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Try to extract the section for this version from CHANGELOG.md
          # Matches from "## [X.Y.Z]" or "## X.Y.Z" until the next "## " heading
          NOTES=""
          if [ -f "CHANGELOG.md" ]; then
            NOTES=$(awk -v ver="$VERSION" '
              BEGIN { found=0; buf="" }
              /^## / {
                if (found) exit
                # Match ## [X.Y.Z] or ## X.Y.Z (with optional date)
                if ($0 ~ "\\[" ver "\\]" || $0 ~ "^## " ver "[ \t-]" || $0 ~ "^## " ver "$") {
                  found=1
                  next
                }
              }
              found { buf = buf $0 "\n" }
              END { printf "%s", buf }
            ' CHANGELOG.md | sed -e 's/^[[:space:]]*//' -e '/^$/N;/^\n$/d')
          fi

          if [ -n "$NOTES" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$NOTES" > /tmp/release-notes.md
            echo "📝 Found release notes for v$VERSION in CHANGELOG.md"
          else
            echo "❌ No release notes found for v$VERSION in CHANGELOG.md. Release notes are required to continue."
            exit 1
          fi

      # ── Version bump ──────────────────────────────────────────
      - name: Bump versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Bump all publishable packages (working tree only, for npm publish)
          pnpm --filter './packages/*' --filter './rebase-agent-skills' -r exec node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version='$VERSION';
            fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          "

      # ── Pre-publish validation ───────────────────────────────
      - name: Validate no workspace protocol in packed output
        run: |
          echo "Packing and validating all publishable packages..."
          PACK_DIR=$(mktemp -d)
          trap 'rm -rf "$PACK_DIR"' EXIT
          ERRORS=0

          for pkg_dir in packages/*/ rebase-agent-skills/; do
            [ -f "$pkg_dir/package.json" ] || continue
            is_private=$(node -e "console.log(require('./$pkg_dir/package.json').private || false)")
            [ "$is_private" = "true" ] && continue
            pkg_name=$(node -e "console.log(require('./$pkg_dir/package.json').name)")

            (cd "$pkg_dir" && pnpm pack --pack-destination "$PACK_DIR") > /dev/null 2>&1
            tarball=$(ls -t "$PACK_DIR"/*.tgz 2>/dev/null | head -1)
            if [ -n "$tarball" ]; then
              packed=$(tar -xzf "$tarball" -O package/package.json 2>/dev/null)
              if echo "$packed" | grep -q '"workspace:'; then
                echo "❌ $pkg_name has workspace: references in packed tarball!"
                echo "$packed" | grep '"workspace:'
                ERRORS=$((ERRORS + 1))
              else
                echo "✅ $pkg_name"
              fi
              rm -f "$tarball"
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS package(s) have workspace: references. ABORTING."
            exit 1
          fi
          echo "✅ All packages clean — safe to publish."

      # ── Publish ─────────────────────────────────────────────
      # No NODE_AUTH_TOKEN — see the canary job's publish step.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: pnpm --filter './packages/*' --filter './rebase-agent-skills' -r publish --no-git-checks --access public --report-summary

      - name: Commit version bump, tag, and push
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Commit the version bumps back to main
          git add -A
          git commit -m "chore: bump version to $VERSION [skip ci]"

          # Create the release tag on the version-bump commit
          git tag -a "v$VERSION" -m "Release v$VERSION"

          # Push both the commit and the tag
          git push origin main --follow-tags

      # ── Self-host runtime image ─────────────────────────────
      #
      # `rebasepro/server` is the image the scaffolded `docker-compose.yml` tells
      # every new project to pull, with `REBASE_VERSION` pinned to the version
      # released just above. Until this step existed nothing published it on a
      # release: `cloudbuild-runtime.yaml` has had a Docker Hub push for months,
      # but it runs only when a human types `gcloud builds submit`, and nobody did.
      # So 0.13.0 shipped a compose file whose first command ends at
      # `pull access denied for rebasepro/server, repository does not exist`.
      #
      # It publishes AFTER npm and the tag on purpose. The image installs the
      # framework from a bundle's own `deps.declared` at boot, so a self-hoster's
      # first boot resolves `@rebasepro/*` from npm — building the image before
      # those versions exist would produce one that cannot boot the release it is
      # named after.
      #
      # Note what this is NOT: the managed fleet is pinned by digest to the private
      # Artifact Registry image that `cloudbuild-runtime.yaml` builds, and this job
      # builds its own from the same commit and Dockerfile. Same source, different
      # digest. That is a deliberate narrowing of the "one artifact everywhere"
      # property, taken because a self-host path that works beats a digest that
      # matches. Replace this with a federated `gcloud builds submit` if the single
      # digest is wanted back — the check in `scripts/check-runtime-image.mjs` only
      # asks that *something* automatic publishes it.
      - name: Set up Docker Buildx
        if: ${{ !inputs.dry_run }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the runtime image
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          # linux/arm64 as well as amd64: a self-hoster on Apple silicon running
          # `docker compose up` gets qemu emulation without it, which is slow
          # enough to read as a hang on first boot.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            rebasepro/server:${{ steps.version.outputs.version }}
            rebasepro/server:latest
          # The compose file resolves `${REBASE_VERSION:-latest}`, so `latest`
          # has to keep moving or a project that clears the variable pulls
          # whatever the first release ever pushed.

      # Publishing is not the same as being pullable. Ask the registry, from
      # outside, with no credentials — the way a self-hoster's daemon will.
      - name: Verify the image is pullable
        if: ${{ !inputs.dry_run }}
        run: node scripts/check-runtime-image.mjs --live --version "${{ steps.version.outputs.version }}"

      # ── GitHub Release ──────────────────────────────────────
      - name: Create GitHub Release (with CHANGELOG notes)
        if: ${{ !inputs.dry_run && steps.notes.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Create GitHub Release (auto-generated notes)
        if: ${{ !inputs.dry_run && steps.notes.outputs.found == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest

      # ── Summary ─────────────────────────────────────────────
      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "### 🚀 Release v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.current }}\` → \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run:** \`${{ inputs.dry_run }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Release notes:** ${{ steps.notes.outputs.found == 'true' && 'From CHANGELOG.md ✍️' || 'Auto-generated from PRs 🤖' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "**📦 npm:** [@rebasepro packages](https://www.npmjs.com/org/rebasepro)" >> $GITHUB_STEP_SUMMARY
            echo "**🏷 Release:** [v${VERSION}](https://github.com/rebasepro/rebase/releases/tag/v${VERSION})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Install with:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "pnpm add @rebasepro/app@${VERSION}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
