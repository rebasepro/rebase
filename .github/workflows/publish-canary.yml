name: Publish Canary Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: canary-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Set canary version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          CANARY_VERSION="0.0.1-canary.${SHORT_SHA}"
          echo "CANARY_VERSION=$CANARY_VERSION" >> $GITHUB_ENV
          echo "Publishing canary version: $CANARY_VERSION"

          # Configure pnpm natively to allow lockfile updates during canary version bump
          pnpm config set frozen-lockfile false
          pnpm config set resolution-worker-threads false

          # Update all package versions without creating git tags or commits
          pnpm exec lerna version "$CANARY_VERSION" --no-git-tag-version --no-push --yes --sync-workspace-lock=false

          # Re-resolve workspace:* links after version bump so pnpm publish can resolve them
          pnpm install --no-frozen-lockfile

          # Commit version changes locally so pnpm publish doesn't complain about dirty git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: canary version $CANARY_VERSION" --no-verify
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: pnpm --filter './packages/*' -r publish --tag canary --no-git-checks --access public --report-summary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "### 🐤 Canary Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ env.CANARY_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pnpm add @rebasepro/core@canary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
