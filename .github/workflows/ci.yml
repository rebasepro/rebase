name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every check lives in verify.yml, which a stable release also calls, so the
  # release gate and this one cannot drift apart.
  verify:
    uses: ./.github/workflows/verify.yml
