<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Rebase — Bento Variant 4: Diagonal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0c0a15;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Full-canvas gradient background ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(99,102,241,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(168,85,247,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(14,165,233,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .bento {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
    width: 1660px;
    height: 920px;
    transform: perspective(1200px) rotateY(-2deg) rotateX(1deg);
    transform-style: preserve-3d;
  }

  .cell {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background: #1a1625;
    border: 1px solid rgba(255,255,255,0.06);
    opacity: 0;
    animation: diagonalReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.35),
      0 0 0 1px rgba(255,255,255,0.03) inset;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .cell:hover {
    transform: translateZ(8px);
    box-shadow:
      0 12px 48px rgba(99,102,241,0.12),
      0 8px 32px rgba(0,0,0,0.4),
      0 0 0 1px rgba(255,255,255,0.06) inset;
  }

  .cell video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .cell::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: 2;
  }

  /* ── Diagonal stagger: top-left → bottom-right ── */
  .cell-1  { grid-column: 1 / 3;  grid-row: 1 / 3; animation-delay: 0.05s; border-radius: 22px; }
  .cell-2  { grid-column: 3 / 4;  grid-row: 1 / 2; animation-delay: 0.15s; }
  .cell-3  { grid-column: 4 / 5;  grid-row: 1 / 2; animation-delay: 0.25s; }
  .cell-4  { grid-column: 3 / 4;  grid-row: 2 / 3; animation-delay: 0.3s; }
  .cell-5  { grid-column: 4 / 5;  grid-row: 2 / 3; animation-delay: 0.4s; }
  .cell-6  { grid-column: 1 / 2;  grid-row: 3 / 4; animation-delay: 0.35s; }
  .cell-7  { grid-column: 2 / 3;  grid-row: 3 / 4; animation-delay: 0.45s; }
  .cell-8  { grid-column: 3 / 5;  grid-row: 3 / 5; animation-delay: 0.5s; border-radius: 22px; }
  .cell-9  { grid-column: 1 / 2;  grid-row: 4 / 5; animation-delay: 0.55s; }
  .cell-10 { grid-column: 2 / 3;  grid-row: 4 / 5; animation-delay: 0.6s; }

  @keyframes diagonalReveal {
    from {
      opacity: 0;
      transform: translateX(-30px) translateY(30px) scale(0.9);
    }
    to {
      opacity: 1;
      transform: translateX(0) translateY(0) scale(1);
    }
  }

  /* Label */
  .label {
    position: absolute;
    bottom: 10px;
    right: 12px;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    z-index: 3;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .cell-1 .label, .cell-8 .label { font-size: 12px; padding: 6px 14px; }

  /* ── Floating particles ── */
  .particle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: rgba(99,102,241,0.3);
    border-radius: 50%;
    z-index: 0;
    animation: float 12s ease-in-out infinite;
    pointer-events: none;
  }

  .particle:nth-child(1) { top: 10%; left: 15%; animation-delay: 0s; }
  .particle:nth-child(2) { top: 25%; right: 20%; animation-delay: 2s; }
  .particle:nth-child(3) { bottom: 30%; left: 10%; animation-delay: 4s; }
  .particle:nth-child(4) { top: 50%; right: 10%; animation-delay: 6s; width: 2px; height: 2px; }
  .particle:nth-child(5) { bottom: 10%; left: 40%; animation-delay: 8s; width: 4px; height: 4px; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
    50% { transform: translateY(-30px) scale(1.5); opacity: 0.7; }
  }
</style>
</head>
<body>

<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

<div class="bento">
  <div class="cell cell-1">
    <video src="../segments/02_view_switch.mp4" autoplay loop muted playsinline></video>
    <div class="label">Card & Table Views</div>
  </div>
  <div class="cell cell-2">
    <video src="../segments/01_dashboard.mp4" autoplay loop muted playsinline></video>
    <div class="label">Dashboard</div>
  </div>
  <div class="cell cell-3">
    <video src="../segments/07_search.mp4" autoplay loop muted playsinline></video>
    <div class="label">Search</div>
  </div>
  <div class="cell cell-4">
    <video src="../segments/05_kanban.mp4" autoplay loop muted playsinline></video>
    <div class="label">Kanban</div>
  </div>
  <div class="cell cell-5">
    <video src="../segments/09_customers.mp4" autoplay loop muted playsinline></video>

  </div>
  <div class="cell cell-6">

  </div>
  <div class="cell cell-7">
    <video src="../segments/03_orders_table.mp4" autoplay loop muted playsinline></video>

  </div>
  <div class="cell cell-8">

  <div class="cell cell-9">

  <div class="cell cell-10">

  </div>
</div>

</html>
