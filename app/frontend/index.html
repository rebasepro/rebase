<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Rebase Live Demo — a real generated admin panel</title>

    <!-- Google Analytics 4 (GA4), only on the hosted demo. Local dev and the
         e2e suite serve this same page on localhost, and were ~70% of the
         property's sessions. Without gtag, App.tsx's onAnalyticsEvent no-ops. -->
    <script>
      if (location.hostname === 'demo.rebase.pro') {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){dataLayer.push(arguments);};
        gtag('js', new Date());
        gtag('config', 'G-715WKXSHF3');
        var ga = document.createElement('script');
        ga.async = true;
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-715WKXSHF3';
        document.head.appendChild(ga);
      }
    </script>

    <!-- Google Identity Services (Sign in with Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root" class="bg-surface-50 dark:bg-surface-900 text-surface-900 dark:text-white"></div>
    <script type="module" src="/src/main.tsx"></script>
<!--    <script type="module" src="/src/performance_text.tsx"></script>-->
  </body>
</html>
