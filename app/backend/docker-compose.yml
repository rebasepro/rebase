# ─── Rebase — Docker Compose (monorepo dev/prod) ─────────────────────
#
# Usage:
#   docker compose up -d
#
# This is for the internal monorepo app (app/backend).
# For the user-facing template, see packages/cli/templates/template/docker-compose.yml

services:
  db:
    # pgvector's image rather than the plain `postgres:18-alpine`: it is the
    # official Postgres image with the `vector` extension already built in, on
    # the same major. A `{ type: "vector" }` property compiles to `VECTOR(n)`,
    # which a stock Postgres answers with `type "vector" does not exist` — a
    # boot failure whose cause is an image, not a config. Nothing here installs
    # extensions on your behalf, so the image is where that decision lives.
    #
    # Swapping this for `postgres:18-alpine` is safe on the same major if you
    # never declare a vector property.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: rebase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rebasepassword}
      POSTGRES_DB: rebase
    ports:
      # `${REBASE_DB_PORT:-5432}`, not a literal, because 5432 is the port a
      # developer is most likely to already be serving. Docker publishes on
      # `0.0.0.0`; a native Postgres binds the MORE SPECIFIC `127.0.0.1`, which
      # wins for `localhost` — so compose starts, reports `Up (healthy)
      # 0.0.0.0:5432->5432/tcp`, and every connection on the documented URL
      # lands in the developer's own database instead. `db push` then writes a
      # schema into it. Nothing errors anywhere along that path.
      #
      # `REBASE_DB_PORT=5499 docker compose up -d db` is the way out, and the
      # same variable belongs in the URL in `app/.env`.
      # `pnpm check:contributor-setup --live` proves the connection reached this
      # container rather than something else answering on the port.
      - "${REBASE_DB_PORT:-5432}:5432"
    volumes:
      # `/var/lib/postgresql`, not `/var/lib/postgresql/data` — the 18 image
      # keeps its data in a major-versioned subdirectory of this path and
      # refuses to start against the old mount. The CLI templates were fixed
      # for this; the reference app and the self-host recipe were missed.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebase -d rebase"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      - "postgres"
      # The marker `pnpm check:contributor-setup --live` reads back. `cluster_name`
      # is settable only at server start and empty by default, so a connection
      # that reports it reached THIS container and not whatever else happened to
      # answer on the published port. Set on the command line rather than in an
      # init script on purpose: an init script runs once, against an empty data
      # directory, so an existing volume would have no marker and the check
      # would fail for the wrong reason.
      - "-c"
      - "cluster_name=rebase-compose"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "log_min_duration_statement=1000"

  backend:
    build:
      context: ../..
      dockerfile: app/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://rebase:${POSTGRES_PASSWORD:-rebasepassword}@db:5432/rebase
      ADMIN_CONNECTION_STRING: postgresql://rebase:${POSTGRES_PASSWORD:-rebasepassword}@db:5432/rebase
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3001"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/app/backend/uploads

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local
