<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Rebase — Bento Variant 3: Cinematic</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #09090b;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ── Central headline ── */
  .headline {
    text-align: center;
    margin-bottom: 36px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
  }

  .headline h1 {
    font-size: 52px;
    font-weight: 600;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #e2e8f0, #94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .headline p {
    font-size: 18px;
    font-weight: 400;
    color: rgba(255,255,255,0.35);
    letter-spacing: -0.01em;
  }

  /* ── Bento grid ── */
  .bento {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 12px;
    width: 1600px;
    height: 700px;
  }

  .cell {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #18181b;
    border: 1px solid rgba(255,255,255,0.05);
    opacity: 0;
    transform: scale(0.9) translateY(30px);
    animation: cellPop 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    transition: box-shadow 0.4s ease;
  }

  .cell:hover {
    box-shadow: 0 8px 48px rgba(99,102,241,0.15), 0 4px 24px rgba(0,0,0,0.4);
  }

  .cell video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Subtle gradient overlay on each cell */
  .cell::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.35) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* ── Grid placement: Cinematic 5-column ── */
  .cell-1  { grid-column: 1 / 3;  grid-row: 1 / 3;  animation-delay: 0.15s; border-radius: 20px; }
  .cell-2  { grid-column: 3 / 4;  grid-row: 1 / 2;  animation-delay: 0.25s; }
  .cell-3  { grid-column: 4 / 6;  grid-row: 1 / 2;  animation-delay: 0.3s; }
  .cell-4  { grid-column: 3 / 4;  grid-row: 2 / 3;  animation-delay: 0.35s; }
  .cell-5  { grid-column: 4 / 5;  grid-row: 2 / 3;  animation-delay: 0.4s; }
  .cell-6  { grid-column: 5 / 6;  grid-row: 2 / 3;  animation-delay: 0.45s; }
  .cell-7  { grid-column: 1 / 2;  grid-row: 3 / 4;  animation-delay: 0.5s; }
  .cell-8  { grid-column: 2 / 4;  grid-row: 3 / 4;  animation-delay: 0.55s; }
  .cell-9  { grid-column: 4 / 5;  grid-row: 3 / 4;  animation-delay: 0.6s; }
  .cell-10 { grid-column: 5 / 6;  grid-row: 3 / 4;  animation-delay: 0.65s; }

  @keyframes cellPop {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Label */
  .label {
    position: absolute;
    bottom: 10px;
    left: 12px;
    font-size: 10px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    z-index: 3;
  }

  .cell-1 .label { font-size: 12px; bottom: 16px; left: 18px; }

  /* Ambient glow */
  .glow {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.08;
    pointer-events: none;
    z-index: 0;
  }

  .glow-1 { top: -200px; left: 200px; background: #6366f1; }
  .glow-2 { bottom: -200px; right: 100px; background: #8b5cf6; }
</style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="headline">
  <h1>Everything you need to ship.</h1>
  <p>A complete admin backend — out of the box.</p>
</div>

<div class="bento">
  <div class="cell cell-1">
    <video src="../segments/04_entity_edit.mp4" autoplay loop muted playsinline></video>
    <div class="label">Entity Editor</div>
  </div>
  <div class="cell cell-2">
    <video src="../segments/01_dashboard.mp4" autoplay loop muted playsinline></video>
    <div class="label">Dashboard</div>
  </div>
  <div class="cell cell-3">
    <video src="../segments/02_view_switch.mp4" autoplay loop muted playsinline></video>
    <div class="label">Card & Table Views</div>
  </div>
  <div class="cell cell-4">
    <video src="../segments/05_kanban.mp4" autoplay loop muted playsinline></video>
    <div class="label">Kanban</div>
  </div>
  <div class="cell cell-5">
    <video src="../segments/09_customers.mp4" autoplay loop muted playsinline></video>
    <div class="label">CRM</div>
  </div>
  <div class="cell cell-6">
    <video src="../segments/03_orders_table.mp4" autoplay loop muted playsinline></video>
    <div class="label">Orders</div>
  </div>
  <div class="cell cell-7">
    <video src="../segments/06_product_edit.mp4" autoplay loop muted playsinline></video>
    <div class="label">Products</div>
  </div>
  <div class="cell cell-8">
    <video src="../segments/10_fullscreen_editor.mp4" autoplay loop muted playsinline></video>
    <div class="label">Block Editor</div>
  </div>
  <div class="cell cell-9">
    <video src="../segments/07_search.mp4" autoplay loop muted playsinline></video>
    <div class="label">Search</div>
  </div>
  <div class="cell cell-10">
    <video src="../segments/08_table_wide.mp4" autoplay loop muted playsinline></video>
    <div class="label">Data Table</div>
  </div>
</div>

</body>
</html>
