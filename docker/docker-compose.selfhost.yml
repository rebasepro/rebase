# Self-hosting Rebase.
#
# Two containers: Postgres, and the Rebase runtime with your project's bundle
# mounted into it. There is no application image to build — the runtime is the
# same published image every Rebase deployment runs, and your project travels as
# a bundle.
#
#   rebase build                          # produces ./dist-bundle
#   docker compose -f docker/docker-compose.selfhost.yml up -d db
#   rebase db push                        # create the collection tables, once
#   docker compose -f docker/docker-compose.selfhost.yml up
#
# To upgrade Rebase, change the image tag and restart. Your bundle is untouched.

name: rebase

services:
  db:
    # Pinned to a major on purpose. `postgres:alpine` would float, and a floating
    # major is how a restart turns into "database files are incompatible with
    # server" at three in the morning.
    #
    # Upgrading this line on a deployment that already has data does NOT migrate
    # it: Postgres refuses to start against a data directory written by an older
    # major. Dump first, then restore into the new volume —
    #   rebase db backup --out ./backups
    #   docker compose down -v && docker compose up -d db
    #   rebase db restore ./backups/<file>.dump
    #
    # pgvector's image rather than the plain `postgres:18-alpine`: it is the
    # official Postgres image with the `vector` extension already built in, on
    # the same major. A `{ type: "vector" }` property compiles to `VECTOR(n)`,
    # which a stock Postgres answers with `type "vector" does not exist` — a
    # boot failure whose cause is an image, not a config. Nothing here installs
    # extensions on your behalf, so the image is where that decision lives.
    #
    # Swapping this for `postgres:18-alpine` is safe on the same major if you
    # never declare a vector property.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: rebase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rebase
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # The runtime must not start before the database can answer, or its first
      # boot fails on a connection refused and the container restarts for no
      # reason a reader would understand.
      test: ["CMD-SHELL", "pg_isready -U rebase -d rebase"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Published so `rebase db push` can reach it from the host. Remove this
    # mapping once the schema is in place if the database should not be
    # reachable from outside the compose network.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    image: rebasepro/server:${REBASE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rebase:${POSTGRES_PASSWORD}@db:5432/rebase
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a random string of at least 32 characters}
      REBASE_SERVICE_KEY: ${REBASE_SERVICE_KEY:?set REBASE_SERVICE_KEY to a random string of at least 32 characters}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the origins your frontend is served from}
      PORT: 8080

      # Auth tables are created at boot. Collection tables are not: run
      # `rebase db push` once, against the database below. A container restart
      # must not be able to change a schema as a side effect.
      REBASE_MIGRATE_ON_BOOT: ${REBASE_MIGRATE_ON_BOOT:-ensure}

      # File storage is off unless a bucket is configured. It is not a default
      # because the alternative — the container filesystem — silently loses every
      # uploaded file on the next restart.
      # STORAGE_TYPE: s3
      # S3_BUCKET: my-bucket
      # S3_REGION: eu-central-1
      # S3_ACCESS_KEY_ID: ...
      # S3_SECRET_ACCESS_KEY: ...

      # A second bucket, reachable from collections as storageSource "media":
      # STORAGE_TYPE__MEDIA: s3
      # S3_BUCKET__MEDIA: my-media-bucket

      # A second database, reachable from collections as dataSource "analytics":
      # DATABASE_URL__ANALYTICS: postgres://…

      # Prometheus metrics at /metrics, behind a bearer token.
      # REBASE_METRICS: "true"
      # REBASE_METRICS_TOKEN: ${REBASE_METRICS_TOKEN:-}
    volumes:
      # Your built project.
      #
      # Writable, because the container installs the bundle's declared
      # dependencies into it on first start — `rebase build` emits a
      # `package.json` but not a `node_modules`. Mounting read-only is better
      # (a compromised hook then cannot rewrite the code that runs after the
      # next restart), and you can do it once the dependencies are already
      # there:
      #
      #     npm install --omit=dev --prefix dist-bundle
      #     # then change this line to: ../dist-bundle:/bundle:ro
      #
      # For a real deployment, prefer baking both into an image:
      #     FROM rebasepro/server:${REBASE_VERSION}
      #     COPY dist-bundle /bundle
      - ../dist-bundle:/bundle
    ports:
      - "${PORT:-8080}:8080"

  # ── Running functions in their own process ─────────────────────────────────
  #
  # Everything above is one container serving the whole project, which is the
  # right shape for almost every deployment. Uncomment the two services below —
  # and set REBASE_ROLE + REBASE_FUNCTIONS_UPSTREAM on `api` — when a custom
  # function should stop competing with the data API for the event loop, or
  # should scale, restart and fail on its own.
  #
  # Same image, same bundle, same database. Only the environment differs.
  #
  #   docker compose up --scale functions=3
  #
  # On `api`, add:
  #     REBASE_ROLE: api
  #     REBASE_FUNCTIONS_UPSTREAM: http://functions:8080
  #
  # `api` then forwards /api/functions/* rather than serving it, so clients and
  # generated SDKs see exactly the URL surface they saw before the split.
  #
  # functions:
  #   image: rebasepro/server:${REBASE_VERSION:-latest}
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     REBASE_ROLE: functions
  #     # Required. One process provisions the schema, and that is `api`.
  #     # Booting without this is refused rather than raced.
  #     REBASE_MIGRATE_ON_BOOT: none
  #     # The api process appends the caller's address to X-Forwarded-For, so
  #     # this process sits behind one more proxy hop than the api does. Without
  #     # it, every forwarded request looks like it came from the api container
  #     # and all callers share a single rate-limit bucket.
  #     TRUSTED_PROXY_HOPS: 1
  #     DATABASE_URL: postgres://rebase:${POSTGRES_PASSWORD}@db:5432/rebase
  #     JWT_SECRET: ${JWT_SECRET}
  #     REBASE_SERVICE_KEY: ${REBASE_SERVICE_KEY}
  #     CORS_ORIGINS: ${CORS_ORIGINS}
  #     PORT: 8080
  #     # Serve one function per replica set, when one of them is the expensive
  #     # one. A name that is not in the bundle refuses to boot.
  #     # REBASE_FUNCTIONS_ONLY: send-invoice
  #   volumes:
  #     - ../dist-bundle:/bundle
  #
  # A third process, for taking cron and the job queue off the request path
  # entirely. Optional: `api` runs both by default, and both are already safe to
  # run in several processes at once — cron claims each (job, slot) pair and the
  # job queue claims rows FOR UPDATE SKIP LOCKED. Add `REBASE_CRON_SCHEDULER:
  # "false"` and `REBASE_JOB_WORKERS: "false"` to the api service if you want
  # this one to be the only place scheduled work runs.
  #
  # worker:
  #   image: rebasepro/server:${REBASE_VERSION:-latest}
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     REBASE_ROLE: worker
  #     REBASE_MIGRATE_ON_BOOT: none
  #     DATABASE_URL: postgres://rebase:${POSTGRES_PASSWORD}@db:5432/rebase
  #     JWT_SECRET: ${JWT_SECRET}
  #     REBASE_SERVICE_KEY: ${REBASE_SERVICE_KEY}
  #     CORS_ORIGINS: ${CORS_ORIGINS}
  #     PORT: 8080
  #   volumes:
  #     - ../dist-bundle:/bundle

volumes:
  db-data:
