; Transaction mode, as the control plane runs it. Unlike the control plane's
; pooler, it ignores no startup parameter but the one node-postgres never
; sends: a pool that still put `statement_timeout` or `options=-c
; search_path` in its startup packet is refused here, loudly, instead of
; having them dropped.
[databases]
rebase = host=primary port=5432 dbname=rebase
rebase_ro = host=standby port=5432 dbname=rebase

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 10
max_client_conn = 200
ignore_startup_parameters = extra_float_digits
server_reset_query =
admin_users = rebase
