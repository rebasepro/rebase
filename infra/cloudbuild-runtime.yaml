# Build and push the platform runtime image — `rebasepro/server`.
#
# ─── This is now the fallback, not the path ──────────────────────────────────
#
# A stable release pushes both registry tags itself (`.github/workflows/publish.yml`),
# and `publish-runtime-image.yml` rebuilds them for a version that already
# shipped. Reach for this file when you want an image from a commit that is not a
# release at all — a canary the fleet should try, or a build from a branch.
#
# Either way the image is only half the job: the fleet runs what
# `runtime_releases` says it may run, so register the tag afterwards with
# `pnpm release:runtime` from `saas/backend`.
#
# This is the image every managed tenant runs and every self-hoster can run: the
# server package plus an entrypoint that boots a project bundle. It is the
# artifact the whole managed tier is defined against, which is why the build for
# it belongs in the repository rather than in someone's shell history.
#
# It was previously an untracked file with the tag hardcoded, and the tag was
# re-pushed at least once. That is the worst property an image can have here: the
# control plane resolves releases by name, so re-pushing a tag silently changes
# what the fleet is running with no version anywhere changing. Two things fix it:
#
#   1. `_TAG` is required and should identify the COMMIT, not a marketing
#      version — `0.10.0-a1b2c3d`. Two builds of different source can then never
#      collide on one name.
#   2. Register the release by DIGEST (`runtime_releases.image_digest`), which
#      the deploy path prefers over the tag. Then even a re-pushed tag cannot
#      move a running fleet.
#
# ─── This file pushes the FLEET tag only ─────────────────────────────────────
#
# The public Docker Hub tags are pushed by GitHub Actions — `publish.yml` on a
# stable release, `publish-runtime-image.yml` to repair a version that already
# shipped. Both authenticate with repository secrets that work. This file does
# not, and should not: what it is for is an image from a commit that is not a
# release, and `rebasepro/server:latest` must never point at one of those.
#
# It DID have a Docker Hub step, reading `dockerhub-token` from Secret Manager —
# a secret the Cloud Build service account cannot access, and has never been able
# to. Every invocation therefore ended in a red build after the fleet tag had
# already been pushed. That was survivable only because of the `push-fleet` step
# below, and it trained the eye to read a failed build as success.
#
# Making the step conditional does not work, and this is worth writing down: a
# `secretEnv` is resolved by Cloud Build when it SETS UP the step, before the
# script runs, so a guard on the first line of the script is never reached. The
# fix for a step that should sometimes not run is to not have the step.
#
# Usage, from the repository root:
#
#   gcloud builds submit --config infra/cloudbuild-runtime.yaml --project=rebase-578f2 \
#     --substitutions=_TAG="$(node -p "require('./packages/server/package.json').version")-$(git rev-parse --short=9 HEAD)" .
#
# The tag names the framework version the image CONTAINS and the commit it was
# built from. Both halves are load-bearing: `release-registration` reads the
# framework straight off the tag, so a tag that overstates its contents becomes a
# wrong `framework_version` in the control plane — which is exactly how two rows
# came to claim 0.16.1 for images containing 0.16.0.
#
# `--project` is not optional in practice: gcloud's active project is
# machine-global and another repository in this account repoints it, which
# surfaces as an Artifact Registry permission denial that reads exactly like an
# IAM regression.
#
# The image is only half the job. The fleet runs what `runtime_releases` says it
# may run, so register the tag afterwards, from `saas/backend`:
#
#   pnpm release:runtime --prod --image-tag=<tag>          # dry run
#   pnpm release:runtime --prod --image-tag=<tag> --apply
#
steps:
  # One build. Every tag below names the same image id, so the digest the
  # control plane registers is the digest a self-hoster pulls.
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    env: ['DOCKER_BUILDKIT=1']
    args:
      - 'build'
      - '-t'
      - '$_REPO:$_TAG'
      - '--build-arg=BUILDKIT_INLINE_CACHE=1'
      - '-f'
      - 'infra/docker/server.Dockerfile'
      - '.'

  # Pushed HERE, explicitly, rather than through an `images:` list — and it stays
  # that way now that this is the only push, because the reason is about the
  # mechanism, not about the step that used to follow it.
  #
  # Cloud Build defers an `images:` list until every step has succeeded. While
  # the fleet tag lived there, a failure in the optional Docker Hub step took the
  # mandatory fleet push down with it, silently: the build log still says
  # "naming to <AR tag> done", which is local tagging, not a push. So a missing
  # `dockerhub-token` read as a self-hoster problem while it was blocking every
  # managed release. Any step added after this one would resurrect that coupling.
  - name: 'gcr.io/cloud-builders/docker'
    id: push-fleet
    args: ['push', '$_REPO:$_TAG']

# No `images:` list. It is the more convenient way to push the private tag, and
# it is the reason a Docker Hub outage could strand a fleet release — see the
# `push-fleet` step. The digest to register comes from that step's push output.

substitutions:
  _REPO: 'europe-west1-docker.pkg.dev/rebase-578f2/rebase-saas-images/rebasepro/server'
  # No default: a build that does not say what it is producing should fail rather
  # than quietly overwrite whatever the last one produced.
  _TAG: ''

options:
  machineType: 'E2_HIGHCPU_8'
timeout: '1800s'
