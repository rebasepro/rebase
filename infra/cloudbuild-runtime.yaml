# Build and push the platform runtime image — `rebasepro/server`.
#
# ─── This is now the fallback, not the path ──────────────────────────────────
#
# A stable release pushes both registry tags itself (`.github/workflows/publish.yml`),
# and `publish-runtime-image.yml` rebuilds them for a version that already
# shipped. Reach for this file when you want an image from a commit that is not a
# release at all — a canary the fleet should try, or a build from a branch.
#
# Either way the image is only half the job: the fleet runs what
# `runtime_releases` says it may run, so register the tag afterwards with
# `pnpm release:runtime` from `saas/backend`.
#
# This is the image every managed tenant runs and every self-hoster can run: the
# server package plus an entrypoint that boots a project bundle. It is the
# artifact the whole managed tier is defined against, which is why the build for
# it belongs in the repository rather than in someone's shell history.
#
# It was previously an untracked file with the tag hardcoded, and the tag was
# re-pushed at least once. That is the worst property an image can have here: the
# control plane resolves releases by name, so re-pushing a tag silently changes
# what the fleet is running with no version anywhere changing. Two things fix it:
#
#   1. `_TAG` is required and should identify the COMMIT, not a marketing
#      version — `0.10.0-a1b2c3d`. Two builds of different source can then never
#      collide on one name.
#   2. Register the release by DIGEST (`runtime_releases.image_digest`), which
#      the deploy path prefers over the tag. Then even a re-pushed tag cannot
#      move a running fleet.
#
# ─── Two registries, one artifact ────────────────────────────────────────────
#
# The fleet pulls from the private Artifact Registry (`_REPO`). Self-hosters pull
# from Docker Hub (`_HUB_REPO`), because that is what the scaffolded
# `docker-compose.yml` names: a bare `rebasepro/server`, with no registry host.
#
# Only the first push existed for a long time, so `docker compose up` failed with
# `pull access denied for rebasepro/server` for every self-hoster who followed
# the README — and the e2e that boots a scaffolded project failed on it too. The
# image was never missing. It was only ever pushed to the registry the public
# path does not read.
#
# One `docker build`, tagged three ways, pushed to both. Building twice would
# produce two artifacts free to disagree, which defeats the claim the compose
# header makes: the artifact you self-host is the artifact Rebase Cloud runs.
#
# `_VERSION` is the marketing version the Hub tags carry (`0.12.0`), separate
# from `_TAG`'s commit identity. Self-hosters pin it through `REBASE_VERSION` in
# `.env`, which `rebase init` writes. `latest` moves; a pinned version does not,
# which is the same immutability the fleet gets from digest pinning.
#
# Usage:
#   gcloud builds submit --config cloudbuild-runtime.yaml \
#     --substitutions=_TAG="0.12.0-$(git rev-parse --short HEAD)",_VERSION="0.12.0" .
#
# Requires a Docker Hub access token in Secret Manager as `dockerhub-token`,
# readable by the Cloud Build service account, with push rights to `rebasepro`.
steps:
  # One build. Every tag below names the same image id, so the digest the
  # control plane registers is the digest a self-hoster pulls.
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    env: ['DOCKER_BUILDKIT=1']
    args:
      - 'build'
      - '-t'
      - '$_REPO:$_TAG'
      - '-t'
      - '$_HUB_REPO:$_VERSION'
      - '-t'
      - '$_HUB_REPO:latest'
      - '--build-arg=BUILDKIT_INLINE_CACHE=1'
      - '-f'
      - 'infra/docker/server.Dockerfile'
      - '.'

  # The fleet tag is pushed HERE, explicitly, rather than through the `images:`
  # list. Cloud Build pushes that list only after every step has succeeded, so
  # while the private tag lived there a failure in the *optional* Docker Hub step
  # below took the *mandatory* fleet push down with it — and did it silently: the
  # build log still says "naming to <AR tag> done", which is local tagging, not a
  # push. A missing `dockerhub-token` therefore looked like a self-hoster problem
  # while it was actually blocking every managed release. Self-hosting is allowed
  # to be broken by a missing secret; the fleet is not.
  - name: 'gcr.io/cloud-builders/docker'
    id: push-fleet
    args: ['push', '$_REPO:$_TAG']

  # Cloud Build is not authenticated for Docker Hub, so the Hub tags cannot go in
  # an `images:` list — they are pushed here, after an explicit login.
  - name: 'gcr.io/cloud-builders/docker'
    id: push-dockerhub
    entrypoint: 'bash'
    secretEnv: ['DOCKERHUB_TOKEN']
    args:
      - '-c'
      - |
        set -euo pipefail
        echo "$$DOCKERHUB_TOKEN" | docker login -u "$_HUB_USER" --password-stdin
        docker push "$_HUB_REPO:$_VERSION"
        docker push "$_HUB_REPO:latest"
        docker logout

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/dockerhub-token/versions/latest
      env: 'DOCKERHUB_TOKEN'

# No `images:` list. It is the more convenient way to push the private tag, and
# it is the reason a Docker Hub outage could strand a fleet release — see the
# `push-fleet` step. The digest to register comes from that step's push output.

substitutions:
  _REPO: 'europe-west1-docker.pkg.dev/rebase-578f2/rebase-saas-images/rebasepro/server'
  _HUB_REPO: 'rebasepro/server'
  _HUB_USER: 'rebasepro'
  # No default: a build that does not say what it is producing should fail rather
  # than quietly overwrite whatever the last one produced.
  _TAG: ''
  # Same reasoning, and more so — an unversioned push to a *public* registry is
  # worse than a failed build.
  _VERSION: ''

options:
  machineType: 'E2_HIGHCPU_8'
timeout: '1800s'
