# DigitalOcean App Platform spec for a Rebase project.
#
# Copy to the repository root as `.do/app.yaml` — App Platform only looks there.
# Then either point the control panel at the repo, or use a deploy button:
#
#   https://cloud.digitalocean.com/apps/new?repo=https://github.com/<you>/<your-project>/tree/main
#
# Replace `<you>/<your-project>` below with the repository this deploys.

name: rebase
region: fra

services:
  - name: rebase
    github:
      repo: <you>/<your-project>
      branch: main
      deploy_on_push: true
    build_command: corepack enable && pnpm install --frozen-lockfile && pnpm build
    run_command: pnpm start
    environment_slug: node-js
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 30
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${rebase-db.DATABASE_URL}
      # SECRET-scoped values are encrypted at rest and never returned by the
      # API. Generate them yourself — App Platform has no generator — and paste
      # them in once:  openssl rand -hex 32
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME_openssl_rand_hex_32
      - key: REBASE_SERVICE_KEY
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME_openssl_rand_hex_32
      # The backend refuses to boot in production without an allowed origin.
      # APP_URL is this app's own public URL.
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      # ─── The first account ──────────────────────────────────────────────
      #
      # A fresh Rebase database has no users, and the registration policy
      # admits the first registration and makes it an admin — otherwise an
      # empty database is a dead end, because bootstrapping an admin needs a
      # caller who is already signed in. App Platform routes ${APP_URL} as
      # soon as the app is live, which makes that a race the operator can
      # lose to whoever finds the sign-up form first.
      #
      # So sign-up is closed and the first account is named instead. Fill both
      # in before the first deploy; the runtime creates the account once,
      # while the user table is still empty.
      - key: DISABLE_SELF_REGISTRATION
        scope: RUN_TIME
        value: "true"
      - key: REBASE_ADMIN_EMAIL
        scope: RUN_TIME
        value: CHANGE_ME_your_email
      # At least 12 characters. Change it after the first sign-in.
      - key: REBASE_ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME_openssl_rand_hex_16
      # Uploads. See infra/blueprints/README.md — `local` storage in production is
      # refused, because the container filesystem is wiped on every deploy.
      # - key: STORAGE_TYPE
      #   scope: RUN_TIME
      #   value: s3

databases:
  - name: rebase-db
    engine: PG
    version: "18"
    production: false
