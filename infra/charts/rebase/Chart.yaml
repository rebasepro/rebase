apiVersion: v2
name: rebase
description: >-
  Rebase on Kubernetes. One image, one bundle, booted as one process or as
  several cooperating ones — an API, a functions tier, a worker, and any number
  of static apps — behind a single host.
type: application

# The chart's version, which tracks the runtime release rather than moving on
# its own. The chart ships with the runtime, its default image tag is already
# held to the runtime's version, and a self-hoster reading two numbers has to
# work out which pairs with which — so there is one number. `check:runtime-image`
# holds this and `appVersion` to @rebasepro/server.
version: 0.17.0

# The default runtime image tag. A deployment pins its own with
# `image.tag`; this is what `helm install` uses when nobody says otherwise —
# so it must name a tag that has actually been published, not the next version.
# `pnpm run check:runtime-image` holds it to @rebasepro/server's version, because
# a chart whose default cannot be pulled fails as ImagePullBackOff on the one
# command the README calls the minimum viable install.
appVersion: "0.17.0"

keywords:
  - baas
  - postgres
  - backend
  - rebase
home: https://rebase.pro
sources:
  - https://github.com/rebase-pro/rebase
maintainers:
  - name: Rebase
    url: https://rebase.pro
