# Ingress-nginx high availability for the managed fleet.
#
# ## Why this file exists
#
# The controller was ONE replica with no PodDisruptionBudget on a GKE Autopilot
# cluster, where Google's autoscaler decides when to evict a pod. Nothing stopped
# it evicting the only ingress, and while it rescheduled every tenant returned
# CONNECTION_REFUSED regardless of its own pods being healthy — the ingress is in
# front of all of them.
#
# That is not a hypothetical: on 2026-08-29 the autoscaler consolidated a node,
# evicted an ingress pod, and the uptime check on app.rebase.pro fell to 0.861.
# It was partial rather than total only because a second replica had been added
# hours earlier.
#
# ## Why a PDB is the actual fix, not the replica count
#
# `externalTrafficPolicy: Local` means the load balancer forwards only to nodes
# running an ingress pod, so a pod moving nodes requires the LB's host list to be
# reconciled. On that date the reconcile lagged the move by ~30 minutes, and
# traffic to the stale node black-holed for the whole window. Replicas alone do
# not prevent that; what prevents the *outage* is never dropping to zero healthy
# backends, which is what `minAvailable: 1` guarantees against every voluntary
# disruption — autoscaler consolidation, node upgrade, drain.
#
# A PDB does NOT cover involuntary disruption. A node hard-failing takes whatever
# is on it, which is why the topology spread below matters: without it both
# replicas can be scheduled onto one node and share its fate.
#
# ## Applying this to a live cluster, in this order
#
# The controller ships `maxUnavailable: 1`. Against ONE replica that is 100%, so
# changing the pod template before scaling up takes the ingress to zero and every
# tenant with it. Scale first, then the budget, then the strategy — none of those
# three touch the pod template, so nothing restarts:
#
#   kubectl scale deploy ingress-nginx-controller -n ingress-nginx --replicas=2
#   kubectl apply -f infra/cluster/ingress-nginx-ha.yaml
#   kubectl patch deploy ingress-nginx-controller -n ingress-nginx \
#     -p '{"spec":{"strategy":{"rollingUpdate":{"maxUnavailable":0,"maxSurge":1}}}}'
#
# Only then the spread constraint, which DOES change the template and therefore
# rolls the controller — safe once two replicas, a budget and maxUnavailable 0
# are in place, and unsafe before:
#
#   kubectl patch deploy ingress-nginx-controller -n ingress-nginx \
#     --type=strategic -p "$(cat infra/cluster/ingress-nginx-spread.yaml)"
#
# Then the drain, which is also a template change, so also a roll:
#
#   kubectl patch deploy ingress-nginx-controller -n ingress-nginx --type=json -p '[
#     {"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--shutdown-grace-period=40"},
#     {"op":"add","path":"/spec/minReadySeconds","value":15}]'
#
# ## Why the drain, when the budget already keeps one pod up
#
# The budget keeps a backend alive; it does not stop the load balancer sending
# traffic to the node that just lost one. Under `externalTrafficPolicy: Local`
# the LB drops a node only after its health check fails three times (~24s on
# GKE), and an nginx that quits on SIGTERM refuses everything routed to it in
# that window. Measured on production 2026-09-13: a rolling restart without the
# grace period failed ~25% of requests for ~25s; with it, 2 of 1,336 across the
# whole roll. `minReadySeconds` is the other half — it holds the next old pod
# until the LB has had time to admit the new one's node. Autopilot evicts this
# pod on every node scale-down, so deploys are not the only thing that pays for
# a missing drain. saas/backend/manifests/ingress-nginx.yaml carries the same.
#
# The controller itself is applied from the upstream ingress-nginx manifests and
# is not managed by Helm here, so nothing reconciles this file automatically. It
# is the record of what a rebuilt cluster needs, and the thing to re-apply after
# an upstream controller upgrade, which will not carry it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: ingress-nginx
