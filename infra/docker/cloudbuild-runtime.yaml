# Build and push the platform runtime image — `rebasepro/server`.
#
# This is the image a MANAGED project's pod runs. It supplies the boot harness
# (`rebase-server`, the bundle-fetch initContainer, the entrypoint); the
# framework itself is installed from the bundle's own `deps.declared` at boot.
# The two are deliberately separate — see saas migration 0030 — which is why the
# tag records the framework this image was BUILT against rather than the one a
# given project ends up running.
#
# Tag convention, matching the rows already in `runtime_releases`:
#
#     <framework-version>[-<commit-sha>]     e.g. 0.11.0-870daf6bf
#
# `_TAG` is a substitution rather than a literal because the previous copy of
# this file hardcoded `0.10.0` and lived, uncommitted, in a worktree. Every
# rebuild therefore silently republished the same tag over a different commit,
# which is precisely the mutable-label problem that made a Docker tag a bad
# place to keep a version. Pass it explicitly:
#
#     gcloud builds submit --config docker/cloudbuild-runtime.yaml \
#       --substitutions=_TAG=0.11.0-$(git rev-parse --short=9 HEAD) .
#
# Then register the result as a runtime release, recording BOTH the contract
# line it implements and the framework it ships. The digest is what the fleet is
# pinned to; the tag is the fallback.
substitutions:
  _TAG: "dev"
  _IMAGE: "europe-west1-docker.pkg.dev/rebase-578f2/rebase-saas-images/rebasepro/server"

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}:${_TAG}'
      - '-f'
      - 'infra/docker/server.Dockerfile'
      - '.'

images:
  - '${_IMAGE}:${_TAG}'

timeout: '1800s'
options:
  machineType: 'E2_HIGHCPU_8'
