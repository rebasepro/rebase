trustLockfile: true
packages:
  - packages/*
  - app
  - app/*
  - e2e
  - website
  - videos
  - examples/*
  - examples/*/*
  - saas/config
  - saas/backend
  - saas/frontend
  - saas
allowBuilds:
  '@ariga/atlas': true
  '@firebase/util': true
  cpu-features: true
  esbuild: true
  mongodb-memory-server: true
  nx: true
  protobufjs: true
  puppeteer: true
  sharp: true
  ssh2: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@firecms/neat@0.9.2'
  - '@firecms/neat@0.9.3-canary.20260615000629'
  - '@firecms/neat@0.9.3-canary.20260615103956'
  - '@firecms/neat@1.0.0'
  - '@firecms/neat@1.0.1'
overrides:
  dompurify: ">=3.4.11"
  nodemailer: ">=9.0.1"
  form-data: ">=4.0.6"
  tmp: ">=0.2.7"
  ws: ">=8.21.0"
  undici: ">=7.28.0 <8"
  uuid: ">=11.1.1"
  js-yaml: ">=4.2.0"
  tar: ">=7.5.16"
  esbuild: ">=0.28.1"
