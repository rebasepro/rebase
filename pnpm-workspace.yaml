trustLockfile: true

# ── Install settings ─────────────────────────────────────────────────────────
#
# All of these lived in `.npmrc`, in kebab-case, and pnpm 11 does not read that
# file any more: `pnpm config get minimum-release-age` answered `undefined` with
# the setting sitting right there under twenty lines of comment explaining why
# it mattered. The tree was resolving with pnpm's defaults — the isolated
# node_modules layout despite `node-linker=hoisted`, no release-age floor at all
# — while npm 12 printed one "Unknown project config" warning per line on every
# npm command. The same move was made in the generated scaffold months ago and
# never here.
#
# `pnpm config get <camelCaseKey>` is the only way to know a setting is live.
# `check:pnpm-settings` runs exactly that.
linkWorkspacePackages: true
preferWorkspacePackages: true
autoInstallPeers: true
saveExact: true
# `.npmrc` said `hoisted` for years and pnpm 11 never read it, so every install
# since the pnpm 11 upgrade — and every green CI run — has been the isolated
# layout. Making `hoisted` live here would change module resolution for the whole
# tree in the same change that moved the keys; keep what is actually running.
# Switching linkers is its own decision, made on purpose, with a full reinstall.
nodeLinker: isolated
hoist: true
# Types hoisted to the root so every workspace compiles against one copy;
# express because its types are resolved by name from several packages.
publicHoistPattern:
  - '@types/*'
  - express
# How new a version may be before this repo will install it, in minutes.
#
# Three days. The attack this bounds is the one that actually happens to npm: a
# maintainer account is compromised, a malicious version is published, and it is
# found and unpublished within hours — so the whole exposure is the window
# between the publish and the discovery. Waiting the window out is a cheap way
# not to be in it, and it costs nothing here because versions are pinned exactly
# (`saveExact`) and CI installs from a frozen lockfile.
#
# This said `0` once, above a comment reading "Temporarily disable release age
# policy for @firecms/neat canary — remove once the package is >24h old". The
# package had been released for two months. A temporary measure with no expiry
# is a permanent one, and that one turned the protection off for every
# dependency in the tree to unblock a single canary; `minimumReleaseAgeExclude`
# below is how a single package is exempted instead.
#
# To take a genuinely fresh version, pass it deliberately for that one install
# rather than lowering it here again:
#     pnpm add <pkg> --config.minimum-release-age=0
minimumReleaseAge: 4320
packages:
  - packages/*
  - tooling/rebase-agent-skills
  - app
  - app/*
  - website
  - tooling/videos
  - examples/*
  # Rebase Cloud's control plane, which is a private repository checked out at
  # `saas/` beside these packages. It is absent from a public clone, and pnpm
  # treats a pattern that matches nothing as matching nothing — no warning, no
  # error, `pnpm install` is unaffected. The entries stay because removing them
  # would break the checkout that does have it, and the `saas` / `saas:prod`
  # scripts in package.json are its entry points.
  - saas/config
  - saas/backend
  - saas/frontend
  - saas
allowBuilds:
  '@ariga/atlas': true
  '@firebase/util': true
  '@google/genai': false
  cpu-features: true
  # Deliberately off. esbuild's postinstall replaces its `bin/esbuild` JS shim
  # with the native binary as a startup optimisation — but pnpm has already
  # written a `.bin` shim that invokes the target with `node`, because the file
  # it inspected had a `#!/usr/bin/env node` shebang. After the swap that shim
  # feeds an ELF to node, and every `pnpm exec esbuild` dies with
  # `SyntaxError: Invalid or unexpected token` on the line reading `ELF`.
  #
  # It only bites where the install is genuinely re-run — a Docker build whose
  # `pnpm fetch` layer was invalidated by a lockfile change. That made it look
  # dormant for as long as deploys reused the cached layer, and it took the
  # control-plane build down the first time the lockfile moved.
  #
  # Skipping the script leaves the JS shim in place; it resolves
  # `@esbuild/<platform>` and spawns the same binary itself. The only cost is a
  # few milliseconds of startup per invocation.
  esbuild: false
  mongodb-memory-server: true
  nx: true
  protobufjs: true
  puppeteer: true
  sharp: true
  ssh2: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@firecms/neat@0.9.2'
  - '@firecms/neat@0.9.3-canary.20260615000629'
  - '@firecms/neat@0.9.3-canary.20260615103956'
  - '@firecms/neat@1.0.0'
  - '@firecms/neat@1.0.1'
  - '@electric-sql/pglite-age@0.0.7'
  - '@electric-sql/pglite-pg_hashids@0.0.7'
  - '@electric-sql/pglite-pg_ivm@0.0.7'
  - '@electric-sql/pglite-pg_textsearch@0.0.8'
  - '@electric-sql/pglite-pg_uuidv7@0.0.7'
  - '@electric-sql/pglite-pgtap@0.0.7'
  - '@electric-sql/pglite-pgvector@0.0.7'
  - '@electric-sql/pglite-socket@0.2.9'
  - '@electric-sql/pglite@0.5.6'
# Security floors. Every entry MUST carry an upper bound: an override replaces
# each transitive consumer's own range, so a bare ">=X" is not a floor but a
# floating pin — the next major to publish gets dragged in on the next resolve,
# whatever asked for what. js-yaml 5 arrived that way and broke the Astro build.
overrides:
  # GHSA-55q2-fjhq-7xh7: an IN_PLACE hook removal left a detached subtree
  # executable. Vulnerable through 3.4.12, so the previous 3.4.11 floor sat
  # inside the range. Reaches a shipped runtime, not just build tooling —
  # monaco-editor pulls it into @rebasepro/studio.
  dompurify: ">=3.4.13 <4"
  # GHSA-2v37-7h3g-55p8: a custom generator loops forever when size is zero.
  # Build tooling only (postcss, via Astro and Remotion). Capped below 4 for the
  # reason at the top of this block; 3.x is what the tree's postcss asks for.
  nanoid: ">=3.3.17 <4"
  nodemailer: ">=9.0.1 <10"
  form-data: ">=4.0.6 <5"
  tmp: ">=0.2.7 <0.3"
  ws: ">=8.21.0 <9"
  undici: ">=7.28.0 <8"
  # Already floated to 14 (ESM-only) back when this was unbounded; capped there
  # rather than dragged back, since the tree builds and tests green on it.
  uuid: ">=11.1.1 <15"
  # Upper bound is load-bearing: js-yaml 5 is ESM-only with no default export,
  # which breaks `import yaml from "js-yaml"` inside Astro/Starlight.
  #
  # Floor raised for GHSA-5p4m-2wfm-xmqj, quadratic CPU in `!!omap` resolution.
  # 4.3.0 was itself the vulnerable version, so the floor was pinning the tree
  # to it — a floor only helps when it sits above the range it names.
  js-yaml: ">=4.3.1 <5"
  # Not in the tree right now; kept so it lands patched if anything pulls it back.
  tar: ">=7.5.16 <8"
  esbuild: ">=0.28.1 <0.29"
  shell-quote: ">=1.9.0 <2"
  protobufjs: ">=7.6.5 <8"
  # GHSA-mh99-v99m-4gvg / CVE-2026-14257 is a DoS with ONE patched version,
  # 5.0.8, and a vulnerable range of `<= 5.0.7` that spans every earlier major —
  # there is no 1.x or 2.x backport to key a floor against. Per-major floors
  # therefore could not fix it: they held 1.1.16 and 2.1.3, both inside the
  # range, and the alert stayed open with the lockfile "at its floor".
  #
  # Collapsed onto one major deliberately, which is the thing this file warns
  # against elsewhere. Two facts make it safe here, and both were checked rather
  # than assumed: 5.0.8 is dual-published (`require` resolves to
  # dist/commonjs/index.js), so the CJS consumers that pull it — minimatch@3.1.5,
  # @5.1.9 and @9.0.9, all build tooling — keep working; and its `engines` is
  # `20 || >=22`, which this repo satisfies. The upper bound stays, for the
  # reason at the top of this block.
  brace-expansion: ">=5.0.8 <6"
  react-router: ">=8.3.0 <9"
  # GHSA-f65p-4m7j-42xc, -jqff-g426-hqxp, -fph4-wmhf-6fwf, -5jgf-p345-68v8:
  # four ways to make fast-uri disagree with the host a request will actually
  # reach — a malformed IPv6 literal, a percent-encoded scheme, a repeated
  # hostname, and skipped IDN canonicalization. All four are the same defect
  # class: the parser's answer and the fetcher's answer differ, which is what
  # turns a URL check into an SSRF.
  #
  # Not build tooling. It arrives twice: through webpack/Remotion, which is,
  # and through `@rebasepro/mcp` as a runtime dependency, which ships. An MCP
  # server is handed URLs by a model, so a parser that can be talked into
  # naming the wrong host is exactly the wrong thing to have there.
  fast-uri: ">=3.1.6 <4"
  # GHSA-73wf-gq98-2v4g: an untrusted BROWSERSLIST value crashes the process or
  # writes through the prototype. devDependencies only, via @babel/core — the
  # value is ours, so this is hygiene rather than exposure.
  browserslist: ">=4.28.7 <5"
  # GHSA-x5fp-wj9c-mxmx and -4mjr-xmp4-gh2g: an array-limit bypass through
  # comma-separated bracket keys, and a denial of service through an
  # attacker-controlled `isBuffer`. Reaches `@rebasepro/mcp` at runtime through
  # @modelcontextprotocol/sdk, and express independently.
  qs: ">=6.16.0 <7"
verifyDepsBeforeRun: false
