trustLockfile: true
packages:
  - packages/*
  - app
  - app/*
  - e2e
  - website
  - videos
  - examples/*
  - examples/*/*
  - saas/config
  - saas/backend
  - saas/frontend
  - saas
allowBuilds:
  '@firebase/util': true
  cpu-features: true
  esbuild: true
  mongodb-memory-server: true
  nx: true
  protobufjs: true
  puppeteer: true
  sharp: true
  ssh2: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@firecms/neat@0.9.2'
  - '@firecms/neat@0.9.3-canary.20260615000629'
  - '@firecms/neat@0.9.3-canary.20260615103956'
  - '@firecms/neat@1.0.0'
